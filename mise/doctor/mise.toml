#:schema https://mise.jdx.dev/schema/mise.json
# Deep live checks across all 3 Day-1 environments (run via `mise -C mise/doctor doctor project`).

[doctor.checks.env-pc]
description = "pc Ubuntu 26.10 amd64 container passes live doctor"
run = "mise -C ../.. run env:doctor --target pc"
timeout = "30s"

[doctor.checks.env-mac]
description = "Mac Docker Desktop Ubuntu 26.10 arm64 container passes live doctor"
os = "macos"
run = "mise -C ../.. run env:doctor --target mac"
timeout = "30s"

[doctor.checks.env-vm]
description = "Mac Tart dotfiles-v2-macos VM passes live doctor"
os = "macos"
run = "mise -C ../.. run env:doctor --target vm"
timeout = "30s"

[doctor.checks.interactive-zsh-smoke]
description = "Interactive zsh login/interactive startup succeeds cleanly without errors"
os = "macos"
run = '''
env -u __MISE_DIFF -u __MISE_SHIM -u __MISE_SESSION -u __MISE_ORIG_PATH PATH=/usr/bin:/bin:/usr/sbin:/sbin zsh -ic 'command -v mise >/dev/null 2>&1 && mise --version >/dev/null'
'''
timeout = "30s"
