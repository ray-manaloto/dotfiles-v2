[doctor.checks.vercel-board-config]
description = "jdx tools, @vercel/board, pitchfork config, bootstrap:skills, and canonical skills are valid"
run = '''
(test -f pitchfork.toml || test -f unix/home/.config/pitchfork/config.toml)
test -x unix/home/.config/mise/tasks/bootstrap/skills
test -x unix/home/.config/mise/assets/board/vb-proxy-wrapper.sh
test -f unix/home/.agents/skills/vercel-board/SKILL.md
test ! -e unix/home/.claude.mcp-jdx.json
test ! -e unix/home/.codex/mcp-jdx.toml
test ! -e unix/home/.config/mise/assets/gemini/mcp-jdx.json
node --check unix/home/.config/mise/assets/board/server.mjs
python3 - <<'PY'
import tomllib
from pathlib import Path

mise_dir = Path("unix/home/.config/mise")
cfg = tomllib.loads((mise_dir / "config.toml").read_text(encoding="utf-8"))
tools = set(cfg.get("tools", {}))
for tool in ("aube", "communique", "fnox", "hk", "npm:@vercel/board", "packslip:grafana/flint", "pitchfork", "usage"):
    assert tool in tools, f"Missing {tool} in unix/home/.config/mise/config.toml [tools]"

all_dotfiles: dict[str, object] = {}
all_groups: list[dict[str, object]] = []
for cfg_path in sorted(mise_dir.glob("config*.toml")):
    cdata = tomllib.loads(cfg_path.read_text(encoding="utf-8"))
    df = cdata.get("dotfiles")
    if isinstance(df, dict):
        all_dotfiles.update(df)
    dg = cdata.get("dotfile_groups")
    if isinstance(dg, dict):
        for grp in dg.values():
            if isinstance(grp, dict):
                all_groups.append(grp)

skills_task_txt = (mise_dir / "tasks" / "bootstrap" / "skills").read_text(encoding="utf-8")

def has_target(target_key: str) -> bool:
    if target_key in all_dotfiles:
        return True
    if target_key.startswith("~/.agents/skills/"):
        name = target_key.rsplit("/", 1)[-1]
        for grp in all_groups:
            entries = grp.get("entries")
            if grp.get("target") == "~/.agents/skills" and (
                (isinstance(entries, dict) and target_key in entries)
                or (
                    "*" not in (grp.get("exclude") or [])
                    and (mise_dir.parent.parent / ".agents" / "skills" / name / "SKILL.md").is_file()
                )
            ):
                return True
            if name in (grp.get("items") or []) and "~/.agents/skills" in str(grp.get("dest_dir") or ""):
                return True
    if target_key.startswith("~/.claude/skills/"):
        name = target_key.rsplit("/", 1)[-1]
        for grp in all_groups:
            entries = grp.get("entries")
            if grp.get("target") == "~/.claude/skills" and isinstance(entries, dict) and target_key in entries:
                return True
            if name in (grp.get("items") or []) and "~/.claude/skills" in str(grp.get("dest_dir") or ""):
                return True
        if '"../../.agents/skills/' in skills_task_txt and (mise_dir.parent.parent / ".agents" / "skills" / name / "SKILL.md").is_file():
            return True
    return False

for key in (
    "~/.agents/skills/vercel-board",
    "~/.claude/skills/vercel-board",
    "~/.agents/AGENTS.md",
):
    assert has_target(key), f"Missing {key} across unix/home/.config/mise/config*.toml [dotfiles]/[dotfile_groups] and bootstrap:skills"
assert "~/.gemini/config/skills" not in all_dotfiles, "Retired ~/.gemini/config/skills mirror must not be declared in [dotfiles]"
assert (
    "av_args=(skills install --harness agents --force)" in skills_task_txt
    and 'agentsview "${av_args[@]}"' in skills_task_txt
), "bootstrap:skills must install the official agentsview skill for ~/.agents"
deps = set(cfg.get("tasks", {}).get("bootstrap", {}).get("depends", []))
assert "bootstrap:skills" in deps, f"bootstrap:skills missing from [tasks.bootstrap].depends: {deps}"
PY
'''
hint = "Ensure pitchfork config, jdx tools, npm:@vercel/board, bootstrap:skills, and canonical ~/.agents/skills are configured cleanly. Details: `mise run doctor:explain vercel-board-config`."

