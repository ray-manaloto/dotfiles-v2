run = "python3 -I -B tasks/py/doctor_checks.py pitchfork-config"
hint = "Validate `unix/home/.config/pitchfork/config.toml` with `pitchfork daemons --json`. Details: `mise run doctor:explain pitchfork-config`."

[doctor.checks.dockerignore-secret-guard]
description = ".dockerignore excludes *.local.*, __pycache__, *.pyc, and .DS_Store from Docker build context"
run = "python3 -I -B tasks/py/doctor_checks.py dockerignore-secret-guard"
hint = "Ensure `.dockerignore` re-excludes `**/*.local.*`, `**/__pycache__`, `**/__pycache__/**`, `**/*.pyc`, and `**/.DS_Store` after `!unix/home/.config/mise/**`. Details: `mise run doctor:explain dockerignore-secret-guard`."

[doctor.checks.git-index-locks]
description = "hk.pkl keeps GIT_OPTIONAL_LOCKS=0 for steps, and no worktree has a stale index.lock"
run = "python3 -I -B tasks/py/doctor_checks.py git-index-locks"
hint = "Keep `env { [\"GIT_OPTIONAL_LOCKS\"] = \"0\" }` at the top of hk.pkl (jdx/hk#1911). For a reported stale lock: confirm no git command runs in that worktree, then remove the named file. Details: `mise run doctor:explain git-index-locks`."

[doctor.checks.mise-version-parity]
description = "Pinned mise versions match across Dockerfile, tasks/vm/up, tasks/pc/up, env:doctor, CI workflows, AGENTS.md, and configs"
run = "python3 -I -B tasks/py/doctor_checks.py mise-version-parity"
hint = "Keep mise version pins synchronized across Dockerfile, tasks/vm/up, tasks/pc/up (incl. PACKSLIP_MISE_PIN), tasks/env/doctor, .github/workflows jdx/mise-action version:, mise.toml, config.toml, and AGENTS.md. Details: `mise run doctor:explain mise-version-parity`."

[doctor.checks.config-hygiene]
description = "mise configs and programs.json pass canonical registry, prerelease, wrapper, and [dotfiles] traversal hygiene checks"
run = "python3 -I -B tasks/py/doctor_checks.py config-hygiene"
hint = "Check `unix/home/.config/mise/config*.toml` and `unix/home/.config/herdr-app/programs.json` against Tier 1/2 hygiene rules. Details: `mise run doctor:explain config-hygiene`."

[doctor.checks.no-repo-skills]
description = "No duplicated repo-level .agents/skills or .claude/skills directories"
# Only skill dirs are forbidden: Claude Code writes runtime state under .claude/ (e.g. scheduled_tasks.lock for
# /ship and /steward watch timers), so forbidding all of .claude/ blocked every watch's pre-push.
run = "test ! -e .agents/skills && test ! -e .claude/skills"
hint = "Remove .agents/skills/ and .claude/skills/ from the repository root; canonical skills live in unix/home/.agents/skills/. Details: `mise run doctor:explain no-repo-skills`."

[doctor.checks.pwf-root-mode]
description = "Committed .mode pins autonomous mode for planning-with-files"
run = 'test -f .mode && test "$(tr -d "[:space:]" < .mode)" = "autonomous"'
hint = "Commit 'autonomous' in .mode at repository root. Details: `mise run doctor:explain pwf-root-mode`."

[doctor.checks.hk-validate]
description = "hk.pkl configuration evaluates cleanly with zero warnings"
run = "hk validate --json --deny-warnings"
hint = "Run 'hk validate --json --deny-warnings' to inspect hk.pkl errors or warnings. Details: `mise run doctor:explain hk-validate`."

[doctor.checks.mise-task-validate]
description = "All mise tasks validate cleanly"
run = "mise task validate"
hint = "Run 'mise task validate' to inspect task definition errors. Details: `mise run doctor:explain mise-task-validate`."

[doctor.checks.pwf-worktree-plan]
description = "Worktree PLAN_ID resolves and passes plan-doctor when set"
run = '''
if [ -z "${PLAN_ID:-}" ]; then
  exit 0
fi
rel_json="$HOME/.local/share/agy-pwf/current/.agy-pwf-release.json"
test -f "$rel_json"
pkg_rel="$(sed -n 's/.*"skill_pkg_rel"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$rel_json" | head -n 1)"
pwf_dir="$HOME/.local/share/agy-pwf/current/$pkg_rel"
resolved="$(sh "$pwf_dir/scripts/resolve-plan-dir.sh")"
test -n "$resolved" && test -f "$resolved/task_plan.md"
! sh "$pwf_dir/scripts/plan-doctor.sh" | grep -q "^FAIL "
'''
hint = "Run 'mise run worktree:new <slug>' or verify .planning/$PLAN_ID. Details: `mise run doctor:explain pwf-worktree-plan`."

