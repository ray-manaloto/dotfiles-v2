#:schema https://mise.jdx.dev/schema/mise.json
# ref: https://mise.jdx.dev/configuration.html

min_version = "2026.11.12"

# User/global developer tools live in unix/home/.config/mise/config.toml so
# this project config never duplicates project-scoped .agents/.claude skills.

[env]
PYTEST_XDIST_AUTO_NUM_WORKERS = "4"

[vars]
private_home = "{{ env.HOME }}"
private_user = "{{ env.USER }}"

[settings]
exec_auto_install = false
experimental = true
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64"]
python.uv_venv_auto = "source"

[deps.uv]
auto = false
run = "uv sync --locked"

[task_config]
includes = ["tasks", "unix/home/.config/mise/tasks"]

[tasks."py:codegen"]
description = "Generate Pydantic v2 models from schemas/**/*.schema.json (or verify with --check)"
usage = 'flag "--check" help="Fail if generated models differ from schemas"'
run = [
  "mise deps uv",
  'uv run --offline --locked datamodel-codegen ${usage_check:+--check}',
]

[tasks."py:test"]
description = "Run full Python test suite via pytest-xdist in locked .venv"
run = ["mise deps uv", "uv run --offline --locked pytest -n auto"]

[tasks."privacy:scan"]
description = "Refuse this machine's home path in tracked files, given files, or outgoing commits"
env = { PRIVATE_PATTERNS = "{{ vars.private_home }}\n/Users/{{ vars.private_user }}/\n/home/{{ vars.private_user }}/" }
usage = '''
flag "--outgoing" help="Scan every commit not yet on a remote, branches and tags (pre-push)"
arg "[file]" var=#true help="Files to scan; default every tracked file"
'''
run = 'repotools privacy-scan --patterns="$PRIVATE_PATTERNS" --files="${usage_file:-}" ${usage_outgoing:+--outgoing}'

[doctor.checks.no-project-tools]
description = "Project mise TOMLs declare zero [tools], no root mise.lock, and slim pyproject.toml"
run = "python3 -I -B tasks/py/doctor_checks.py no-project-tools"
hint = "Declare global tools in unix/home/.config/mise/config.toml and keep dev/lint CLI tools out of [project].dependencies."

[doctor.checks.py-deps-fresh]
description = "Root .venv matches pyproject.toml and uv.lock via mise deps uv --explain"
run = "mise deps uv --explain"
hint = "Run 'mise deps uv' to sync .venv with uv.lock."

[doctor.checks.schema-first-ast]
description = "No hand-written BaseModel/dataclass/Enum/TypedDict DTOs outside generated modules and tests"
run = "python3 -I -B tasks/py/schema_first_ast.py"
hint = "Declare DTOs and Enums in schemas/**/*.schema.json and run 'mise run py:codegen'."

[doctor.checks.schema-contract-check]
description = "All schemas/**/*.schema.json satisfy Draft 2020-12 and envelope contracts"
run = "python3 -I -B tasks/py/schema_contract_check.py"
hint = "Ensure every schema declares Draft 2020-12, additionalProperties: false, and envelope fields."

[doctor.checks.mise-lock-integrity]
description = "unix/home/.config/mise/mise.lock and locks/ match config.toml across all platforms"
run = "python3 -I -B tasks/py/doctor_checks.py mise-lock-integrity"
hint = "Run `MISE_CONFIG_DIR=$PWD/unix/home/.config/mise mise lock` and ensure 0644 lockfile permissions."

[doctor.checks.host-option-a]
description = "Option A host parity, no-legacy-symlinks, roll-ownership, and dotfiles status (pre-cutover aware)"
run = "python3 -I -B tasks/py/doctor_checks.py host-option-a"
hint = "Complete Issue #9 Option A host cutover (~/.config/mise -> dotfiles-v2/unix/home/.config/mise) and sync dotfiles."

[doctor.checks.no-repo-skills]
description = "No duplicated repo-level .agents or .claude skill directories"
run = "test ! -e .agents && test ! -e .claude"
hint = "Remove .agents/ and .claude/ from the repository root."

[doctor.checks.pwf-root-mode]
description = "Committed .mode pins autonomous mode for planning-with-files"
run = 'test -f .mode && test "$(tr -d "[:space:]" < .mode)" = "autonomous"'
hint = "Commit 'autonomous' in .mode at repository root."

[doctor.checks.hk-validate]
description = "hk.pkl configuration evaluates cleanly"
run = "hk validate"
hint = "Run 'hk validate' to inspect hk.pkl errors."

[doctor.checks.mise-task-validate]
description = "All mise tasks validate cleanly"
run = "mise task validate"
hint = "Run 'mise task validate' to inspect task definition errors."

[doctor.checks.pwf-worktree-plan]
description = "Worktree PLAN_ID resolves and passes plan-doctor when set"
run = '''
if [ -z "${PLAN_ID:-}" ]; then
  exit 0
fi
rel_json="$HOME/.local/share/agy-pwf/current/.agy-pwf-release.json"
test -f "$rel_json"
pkg_rel="$(sed -n 's/.*"skill_pkg_rel"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$rel_json" | head -n 1)"
pwf_dir="$HOME/.local/share/agy-pwf/current/$pkg_rel"
resolved="$(sh "$pwf_dir/scripts/resolve-plan-dir.sh")"
test -n "$resolved" && test -f "$resolved/task_plan.md"
! sh "$pwf_dir/scripts/plan-doctor.sh" | grep -q "^FAIL "
'''
hint = "Run 'mise run worktree:new <slug>' or verify .planning/$PLAN_ID."

[doctor.checks.agy-skill-cutoff]
description = "Antigravity 24 KB skill cutoff hook and universal rule are valid and replace hardcoded last30days rule"
run = '''
test -x unix/home/.gemini/config/hooks/agy-skill-cutoff.py
test -f unix/home/.gemini/config/rules/skill-cutoff-agy.md
test ! -e unix/home/.gemini/config/rules/last30days-agy.md
python3 -I -B unix/home/.gemini/config/hooks/agy-skill-cutoff.py --check --no-write --json >/dev/null
'''
hint = "Ensure unix/home/.gemini/config/hooks/agy-skill-cutoff.py is executable and skill-cutoff-agy.md replaces last30days-agy.md."

[doctor.checks.agy-pwf-guard]
description = "Antigravity PWF PreToolUse guard hook and hooks.json registration are valid"
run = '''
test -x unix/home/.gemini/config/hooks/agy-pwf-guard.py
python3 -I -B unix/home/.gemini/config/hooks/agy-pwf-guard.py --self-check --check-hooks-json unix/home/.gemini/config/hooks.json >/dev/null
'''
hint = "Ensure unix/home/.gemini/config/hooks/agy-pwf-guard.py is executable, passes --self-check, and registers in hooks.json."

[doctor.checks.agy-interactive-questions]
description = "Antigravity interactive-questions PreToolUse/Stop hook, rule, and hooks.json registration are valid"
run = '''
test -x unix/home/.gemini/config/hooks/agy-interactive-questions.py
test -f unix/home/.gemini/config/rules/interactive-questions.md
python3 -I -B unix/home/.gemini/config/hooks/agy-interactive-questions.py --self-check --check-hooks-json unix/home/.gemini/config/hooks.json >/dev/null
'''
hint = "Ensure unix/home/.gemini/config/hooks/agy-interactive-questions.py passes --self-check and registers in hooks.json."

[doctor.checks.post-task-learn]
description = "Antigravity post-task-learn Stop hook, skill, and hooks.json registration are valid"
run = '''
test -x unix/home/.gemini/config/hooks/post-task-learn.py
test -f unix/home/.agents/skills/post-task-learn/SKILL.md
python3 -I -B unix/home/.gemini/config/hooks/post-task-learn.py --self-check --check-hooks-json unix/home/.gemini/config/hooks.json >/dev/null
'''
hint = "Ensure unix/home/.gemini/config/hooks/post-task-learn.py passes --self-check and registers in hooks.json."

[doctor.checks.host-gemini-sync]
description = "Local ~/.gemini/config/ hooks, rules, skills, and hooks.json match unix/home/.gemini/config/ and [dotfiles]"
run = "mise run host:sync-gemini --check"
hint = "Run 'mise run host:sync-gemini' to sync ~/.gemini/config/ hooks, rules, skills, and hooks.json on this host."

[doctor.checks.native-harnesses]
description = "Global mise config blocks non-native AI harnesses and mise installs via disable_tools and auto_install_disable_tools"
run = '''
python3 - <<'PY'
import tomllib
from pathlib import Path

cfg = tomllib.loads(Path("unix/home/.config/mise/config.toml").read_text(encoding="utf-8"))
tools = set(cfg.get("tools", {}))
settings = cfg.get("settings", {})
required = {"claude", "codex", "agy", "opencode", "mise"}
forbidden_tools = tools & (required | {"antigravity-cli", "npm:antigravity-cli", "npm:@openai/codex", "npm:@anthropic-ai/claude-code"})
assert not forbidden_tools, f"Native harnesses/mise must not be in [tools]: {sorted(forbidden_tools)}"
for key in ("disable_tools", "auto_install_disable_tools"):
    vals = set(settings.get(key, []))
    missing = required - vals
    assert not missing, f"{key} missing: {sorted(missing)}"
PY
'''
hint = "Keep claude, codex, agy, opencode, and mise in disable_tools and auto_install_disable_tools (not [tools]) in unix/home/.config/mise/config.toml."

[doctor.checks.zcode-config]
description = "Committed ZCode settings and AGENTS.md are registered in [dotfiles] and pass zcode doctor --json"
run = '''
test -f unix/home/.zcode/cli/setting.json
python3 - <<'PY'
import json
import os
import shutil
import subprocess
import tomllib
from pathlib import Path

json.loads(Path("unix/home/.zcode/cli/setting.json").read_text(encoding="utf-8"))
cfg = tomllib.loads(Path("unix/home/.config/mise/config.toml").read_text(encoding="utf-8"))
dotfiles = cfg.get("dotfiles", {})
for key in ("~/.zcode/cli/setting.json", "~/.zcode/AGENTS.md"):
    assert key in dotfiles, f"Missing {key} in unix/home/.config/mise/config.toml [dotfiles]"
if shutil.which("zcode"):
    env = dict(os.environ)
    env["ZCODE_CLI_SETTINGS_FILE"] = str(Path("unix/home/.zcode/cli/setting.json").resolve())
    out = subprocess.check_output(
        ["zcode", "doctor", "--json"],
        stdin=subprocess.DEVNULL,
        env=env,
        text=True,
    )
    zcfg = json.loads(out).get("configuration", {})
    assert zcfg.get("ok") is True, zcfg
    assert zcfg.get("user", {}).get("status") == "loaded", zcfg
    assert zcfg.get("diagnostics") == [], zcfg
PY
'''
hint = "Keep unix/home/.zcode/cli/setting.json valid, registered in [dotfiles] with ~/.zcode/AGENTS.md, and passing zcode doctor --json."

[doctor.checks.agy-code-review-guard]
description = "Antigravity code-review PreToolUse guard hook, always-on protocol rule, and hooks.json registration are valid"
run = '''
test -x unix/home/.gemini/config/hooks/agy-code-review-guard.py
test -f unix/home/.gemini/config/rules/code-review-protocol.md
python3 -I -B unix/home/.gemini/config/hooks/agy-code-review-guard.py --self-check --check-hooks-json unix/home/.gemini/config/hooks.json >/dev/null
'''
hint = "Ensure unix/home/.gemini/config/hooks/agy-code-review-guard.py is executable, passes --self-check, and registers with code-review-protocol.md."

[doctor.checks.agy-hc-send-guard]
description = "Antigravity hc-send PreToolUse guard hook, always-on peer-messaging rule, and hooks.json registration are valid"
run = '''
test -x unix/home/.gemini/config/hooks/agy-hc-send-guard.py
test -f unix/home/.gemini/config/rules/agy-peer-messaging.md
python3 -I -B unix/home/.gemini/config/hooks/agy-hc-send-guard.py --self-check --check-hooks-json unix/home/.gemini/config/hooks.json >/dev/null
'''
hint = "Ensure unix/home/.gemini/config/hooks/agy-hc-send-guard.py is executable, passes --self-check, and registers with agy-peer-messaging.md."

[doctor.checks.vercel-board-config]
description = "jdx tools, @vercel/board, pitchfork config, mcp-jdx, bootstrap:skills, and canonical skills are valid"
run = '''
(test -f pitchfork.toml || test -f unix/home/.config/pitchfork/config.toml)
test -x unix/home/.config/mise/tasks/bootstrap/skills
test -x unix/home/.config/mise/assets/board/vb-proxy-wrapper.sh
test -f unix/home/.agents/skills/vercel-board/SKILL.md
test -f unix/home/.claude.mcp-jdx.json
test -f unix/home/.codex/mcp-jdx.toml
node --check unix/home/.config/mise/assets/board/server.mjs
python3 - <<'PY'
import json
import tomllib
from pathlib import Path

json.loads(Path("unix/home/.claude.mcp-jdx.json").read_text(encoding="utf-8"))
tomllib.loads(Path("unix/home/.codex/mcp-jdx.toml").read_text(encoding="utf-8"))
cfg = tomllib.loads(Path("unix/home/.config/mise/config.toml").read_text(encoding="utf-8"))
tools = set(cfg.get("tools", {}))
for tool in ("aube", "communique", "fnox", "hk", "npm:@vercel/board", "packslip:grafana/flint", "pitchfork", "usage"):
    assert tool in tools, f"Missing {tool} in unix/home/.config/mise/config.toml [tools]"
dotfiles = cfg.get("dotfiles", {})
for key in (
    "~/.agents/skills/vercel-board",
    "~/.claude/skills/vercel-board",
    "~/.gemini/config/skills",
    "~/.claude.json/mcp-jdx",
    "~/.codex/config.toml/mcp-jdx",
):
    assert key in dotfiles, f"Missing {key} in unix/home/.config/mise/config.toml [dotfiles]"
deps = set(cfg.get("tasks", {}).get("bootstrap", {}).get("depends", []))
assert "bootstrap:skills" in deps, f"bootstrap:skills missing from [tasks.bootstrap].depends: {deps}"
PY
'''
hint = "Ensure pitchfork config, jdx tools, npm:@vercel/board, mcp-jdx, bootstrap:skills, and canonical ~/.agents/skills are configured cleanly."

[doctor.checks.herdr-roll]
description = "Clean-room herdr_roll engine tests and executable roll:* tasks pass validation"
run = '''
for task in snapshot restart stop start verify self; do
  test -x "unix/home/.config/mise/tasks/roll/$task"
done
test -f "unix/home/.agents/skills/herdr-roll/SKILL.md"
.venv/bin/python -I -B -m unittest discover -s unix/home/.config/mise/lib/herdr_roll/tests -t unix/home/.config/mise/lib
'''
hint = "Ensure unix/home/.config/mise/tasks/roll/* are executable, .venv is synced via `mise deps uv`, and herdr_roll unit tests pass."

[doctor.checks.agy-learn-heal]
description = "Self-healing agy-learn ledger and schemas pass read-only health check"
depends = "py-deps-fresh"
run = "mise run learn:heal --check --repo ."
hint = "Inspect '$XDG_STATE_HOME/agy-learn/' via 'mise run learn:heal --check' and resolve any owing_learn or proposal bloat."
