# ref: https://mise.jdx.dev/configuration.html
#:schema https://mise.jdx.dev/schema/mise.json

min_version = "2026.11.12"

[tools]
hk = "2.13.0"
pkl = "0.33.1"
betterleaks = "1.10.1"
hadolint = "2.15.1"
tombi = "1.11.3"
rumdl = "0.3.5"
shfmt = "3.14.1"
shellcheck = "0.11.0"
typos = "1.52.2"

[settings]
experimental = true
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64"]
exec_auto_install = false
dotfiles.root = "unix/home"

[task_config]
includes = ["tasks"]

[hooks]
postinstall = '[ -n "${CI:-}" ] || hk install --mise'
