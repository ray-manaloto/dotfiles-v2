run = "python3 -I -B tasks/py/doctor_checks.py jouet-rules"
hint = "Run `jouet rule test --all` and fix failing rule patterns or examples. Details: `mise run doctor:explain jouet-rules`."

[doctor.checks.usage-lint]
description = "All #USAGE task specifications pass `usage lint -W -q`"
run = "python3 -I -B tasks/py/doctor_checks.py usage-lint"
hint = "Run `usage lint -W -q <task-file>` and fix any warnings or syntax errors. Details: `mise run doctor:explain usage-lint`."

[doctor.checks.pitchfork-config]
