description = "Antigravity CLI Remote Control guard and LaunchAgent health pass on macOS hosts"
run = "python3 -I -B tasks/py/doctor_checks.py agy-rc-health"
hint = "Inspect or heal Remote Control via `mise run host:agy-rc-guard`. Details: `mise run doctor:explain agy-rc-health`."

[doctor.checks.pc-hub-config]
description = "pc Hub Compose, Caddyfile, SearXNG, mac-agent, and zero-OTel/zero-CBM-HTTP invariants pass offline validation"
depends = "py-deps-fresh"
run = "mise run hub:doctor --offline"
hint = "Inspect docker/pc-hub/{compose.yaml,Caddyfile,searxng/settings.yml} and docker/mac-agent/compose.yaml with `mise run hub:doctor --offline`. Details: `mise run doctor:explain pc-hub-config`."

[doctor.checks.claude-ship-env]
description = "Managed and live Claude settings never disable feature-flag fetching, /ship or /steward, and keep claude.ai connectors off (env, skillOverrides, disableBundledSkills, disableClaudeAiConnectors, shell env, active checkout venv)"
run = "python3 -I -B tasks/py/doctor_checks.py claude-ship-env"
hint = "Remove the flagged env var / override; keep disableClaudeAiConnectors=true unless a connector is really needed; scope telemetry opt-outs to a single command. See docs/pr-shipping-protocol.md. Details: `mise run doctor:explain claude-ship-env`."

[doctor.checks.reviewer-plugins]
description = "Reviewer-bot plugins (Graphify, Greptile, CodeRabbit, Repowise) declared in assets/reviewer-plugins.json are installed in Claude/Codex/agy/OpenCode, Claude plugin MCPs Connected, and Repowise's Bash rewrite disabled in indexed repos"
run = "python3 -I -B tasks/py/doctor_checks.py reviewer-plugins"
timeout = "420s"
hint = "Run `mise run bootstrap:reviewer-plugins` (and `mise run repowise:guard`), then in Claude Code run /mcp -> <server> -> Authenticate. Details: `mise run doctor:explain reviewer-plugins`."

[doctor.checks.skills-6harness-parity]
description = "Canonical ~/.agents/skills parity across Codex, OpenCode, AGY, Claude, ZCode, and Hermes"
run = "python3 -I -B tasks/py/doctor_checks.py skills-6harness-parity"
hint = "Run `mise run bootstrap:skills` and keep canonical skills under unix/home/.agents/skills/. Details: `mise run doctor:explain skills-6harness-parity`."
