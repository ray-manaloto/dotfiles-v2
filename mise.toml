#:schema https://mise.jdx.dev/schema/mise.json
# ref: https://mise.jdx.dev/configuration.html

min_version = "2026.11.14"

# User/global developer tools live in unix/home/.config/mise/config.toml so
# this project config never duplicates project-scoped .agents/.claude skills.

[env]
PYTEST_XDIST_AUTO_NUM_WORKERS = "4"

[vars]
private_home = "{{ env.HOME }}"
private_user = "{{ env.USER | default(value='') }}"

[settings]
exec_auto_install = false
experimental = true
# Never auto-activate .venv: a checkout dir on PATH makes /ship and /steward refuse to watch PRs
# (code.claude.com/docs/en/ship-command-troubleshooting). Tasks use `uv run` or .venv/bin/python explicitly.
python.uv_venv_auto = false

[secrets.fnox]
profile = "infra"

[deps.uv]
auto = false
run = "uv sync --locked"

[task_config]
includes = ["tasks", "unix/home/.config/mise/tasks"]

[tasks."py:codegen"]
description = "Generate Pydantic v2 models from schemas/**/*.schema.json (or verify with --check)"
usage = 'flag "--check" help="Fail if generated models differ from schemas"'
run = [
  "mise deps uv",
  'uv run --offline --locked datamodel-codegen ${usage_check:+--check}',
]

[tasks."py:test"]
description = "Run full Python test suite via pytest-xdist in locked .venv"
run = ["mise deps uv", "uv run --offline --locked pytest -n auto"]

[tasks."privacy:scan"]
description = "Refuse this machine's home path in tracked files, given files, or outgoing commits"
env = { PRIVATE_PATTERNS = "{{ vars.private_home }}\n/Users/{{ vars.private_user }}/\n/home/{{ vars.private_user }}/" }
usage = '''
flag "--outgoing" help="Scan every commit not yet on a remote, branches and tags (pre-push)"
arg "[file]" var=#true help="Files to scan; default every tracked file"
'''
run = 'repotools privacy-scan --patterns="$PRIVATE_PATTERNS" --files="${usage_file:-}" ${usage_outgoing:+--outgoing}'

[doctor.checks.no-project-tools]
description = "Project mise TOMLs declare zero [tools], no root mise.lock, and slim pyproject.toml"
run = "python3 -I -B tasks/py/doctor_checks.py no-project-tools"
hint = "Declare global tools in unix/home/.config/mise/config.toml and keep dev/lint CLI tools out of [project].dependencies. Details: `mise run doctor:explain no-project-tools`."

[doctor.checks.py-deps-fresh]
description = "Root .venv matches pyproject.toml and uv.lock via mise deps uv --explain"
run = "mise deps uv --explain"
hint = "Run 'mise deps uv' to sync .venv with uv.lock. Details: `mise run doctor:explain py-deps-fresh`."

[doctor.checks.schema-first-ast]
description = "No hand-written BaseModel/dataclass/Enum/TypedDict DTOs outside generated modules and tests"
run = "python3 -I -B tasks/py/schema_first_ast.py"
hint = "Declare DTOs and Enums in schemas/**/*.schema.json and run 'mise run py:codegen'. Details: `mise run doctor:explain schema-first-ast`."

[doctor.checks.schema-contract-check]
description = "All schemas/**/*.schema.json satisfy Draft 2020-12 and envelope contracts"
run = "python3 -I -B tasks/py/schema_contract_check.py"
hint = "Ensure every schema declares Draft 2020-12, additionalProperties: false, and envelope fields. Details: `mise run doctor:explain schema-contract-check`."

[doctor.checks.mise-lock-integrity]
description = "unix/home/.config/mise/mise.lock and locks/ match config.toml across all platforms"
run = 'python3 -I -B tasks/py/doctor_checks.py mise-lock-integrity && MISE_OFFLINE=1 MISE_CONFIG_DIR="$PWD/unix/home/.config/mise" mise -C unix/home/.config/mise lock --check --global'
hint = "Run `MISE_CONFIG_DIR=$PWD/unix/home/.config/mise mise lock` and ensure 0644 lockfile permissions. Details: `mise run doctor:explain mise-lock-integrity`."

[doctor.checks.host-option-a]
description = "Strict Option A host parity, no-legacy-symlinks, roll-ownership, and dotfiles status"
run = "python3 -I -B tasks/py/doctor_checks.py host-option-a --strict-host"
hint = "Complete Issue #9 Option A host cutover (~/.config/mise -> dotfiles-v2/unix/home/.config/mise) and sync dotfiles. Details: `mise run doctor:explain host-option-a`."

[doctor.checks.mise-doctor-clean]
description = "Global mise doctor --json reports 0 errors and 0 warnings"
run = "python3 -I -B tasks/py/doctor_checks.py mise-doctor-clean"
hint = "Inspect `mise -C ~ doctor --json` and eliminate any errors or PATH-ordering warnings. Details: `mise run doctor:explain mise-doctor-clean`."

[doctor.checks.host-hygiene]
description = "Host shims, command-wrappers, mise plugins, pitchfork daemons, vb, local bins, opencode.jsonc, config.local.toml, and skills parity are clean"
run = "python3 -I -B tasks/py/doctor_checks.py host-hygiene"
hint = "Run `mise run host:prune --apply` and `mise run bootstrap:skills` to clear stale host residue. Details: `mise run doctor:explain host-hygiene`."

[doctor.checks.uv-env-integrity]
description = "uv lockfile, environment packages, and locked dry-run sync pass offline checks"
depends = "py-deps-fresh"
run = "uv lock --check --offline && uv pip check && uv sync --locked --offline --dry-run"
hint = "Run `mise deps uv` and `uv lock` to reconcile pyproject.toml, uv.lock, and .venv. Details: `mise run doctor:explain uv-env-integrity`."

[doctor.checks.jouet-rules]
