# agnix (agent-sh/agnix 0.61.0): agent configuration validation in hk.
tools = ["antigravity", "claude-code", "codex", "opencode"]

# Synced via mise [dotfiles] to ~/.config/opencode/opencode.json rather than used project-local.
[[overrides]]
paths = ["unix/home/.config/opencode/opencode.json"]
disabled_rules = ["OC-CFG-022"]

# False positive on `mise run secret:set` task name (betterleaks still scans AGENTS.md).
[[overrides]]
paths = ["unix/home/.config/agents/AGENTS.md"]
disabled_rules = ["CDX-AG-002"]
