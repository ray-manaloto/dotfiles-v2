#:schema https://fnox.jdx.dev/schema.json
# Strict research egress profile overlay; invoke with:
# `fnox --non-interactive -c ~/.config/fnox/research.toml -P research --no-defaults proxy run -- <cmd>`

import = ["./shared.toml"]

[proxy]
egress = "strict"
rules = [
  { secret = "CONTEXT7_API_KEY", domain = "context7.com", header = "authorization", placeholder = "fnox-placeholder-context7-mcp" },
  { secret = "EXA_API_KEY", domain = "api.exa.ai", header = "x-api-key", placeholder = "fnox-placeholder-exa-mcp" },
  { secret = "EXA_API_KEY", domain = "api.exa.ai", header = "authorization", placeholder = "fnox-placeholder-exa-mcp" },
  { secret = "APIFY_TOKEN", domain = "api.apify.com", header = "authorization", placeholder = "fnox-placeholder-apify-token" },
  { secret = "FIRECRAWL_API_KEY", domain = "api.firecrawl.dev", header = "authorization", placeholder = "fnox-placeholder-firecrawl-mcp" },
  { secret = "SERPER_API_KEY", domain = "google.serper.dev", header = "x-api-key" },
  { secret = "SERP_API_KEY", domain = "serpapi.com", query = "api_key" },
  { secret = "SCRAPECREATORS_API_KEY", domain = "api.scrapecreators.com", header = "x-api-key" },
]
