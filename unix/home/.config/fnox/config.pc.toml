#:schema https://fnox.jdx.dev/schema.json
# pc-only fnox config (no age key). The Doppler provider reads config `pc`, which holds only the keys pc
# needs, with the read-only service token `pc-fnox` from ~/.config/fnox/doppler-pc.env (0600,
# `DOPPLER_TOKEN=...`). A file, not `doppler configure set token`: that stores the token in the system
# keyring, which can be locked after a reboot or before a desktop login.
# dev_personal references `pc` for these keys, so `pc` is their single source.

import = ["./shared.toml"]

[providers.pc_doppler_token_file]
type = "plain"
file = "~/.config/fnox/doppler-pc.env"
format = "env"

# Replaces the shared provider as a whole: same name, so shared secrets keep resolving against config `pc`.
[providers.doppler_dotfiles_dev_personal]
type = "doppler"
project = "dotfiles"
config = "pc"
token = { secret = "DOPPLER_TOKEN" }

# Replaces the shared age-encrypted dev_personal token with pc's own token file.
[secrets]
DOPPLER_TOKEN = { provider = "pc_doppler_token_file", value = "DOPPLER_TOKEN", env = false }
# Shared keys deliberately not provisioned in Doppler config `pc`.
KILO_API_KEY = { provider = "doppler_dotfiles_dev_personal", value = "KILO_API_KEY", env = false, if_missing = "ignore" }
OPENAI_COMPATIBLE_API_KEY = { provider = "doppler_dotfiles_dev_personal", value = "KILO_API_KEY", env = false, if_missing = "ignore" }
GROQ_API_KEY = { provider = "doppler_dotfiles_dev_personal", value = "GROQ_API_KEY", env = false, if_missing = "ignore" }
AIHUBMIX_API_KEY = { provider = "doppler_dotfiles_dev_personal", value = "AIHUBMIX_API_KEY", env = false, if_missing = "ignore" }
CLOUDFLARE_API_KEY = { provider = "doppler_dotfiles_dev_personal", value = "CLOUDFLARE_API_KEY", env = false, if_missing = "ignore" }
CF_ACCOUNT_ID = { provider = "doppler_dotfiles_dev_personal", value = "CLOUDFLARE_ACCOUNT_ID", env = "exec", if_missing = "ignore" }
CLOUDFLARE_ACCOUNT_ID = { provider = "doppler_dotfiles_dev_personal", value = "CLOUDFLARE_ACCOUNT_ID", env = "exec", if_missing = "ignore" }
AGENTSVIEW_RECALL_PROXY_KEY = { provider = "doppler_dotfiles_dev_personal", value = "AGENTSVIEW_RECALL_PROXY_KEY", env = "exec", if_missing = "ignore" }
PC_HOST = { provider = "doppler_dotfiles_dev_personal", value = "PC_HOST", env = "exec", if_missing = "ignore" }
PC_LAN_HOST = { provider = "doppler_dotfiles_dev_personal", value = "PC_LAN_HOST", env = "exec", if_missing = "ignore" }

[profiles.doppler-auth.secrets]
DOPPLER_TOKEN = { provider = "pc_doppler_token_file", value = "DOPPLER_TOKEN", env = false }
