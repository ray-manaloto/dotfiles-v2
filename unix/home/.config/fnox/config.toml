#:schema https://fnox.jdx.dev/schema.json
# macOS host global fnox config (uses Keychain-backed age identity; Linux containers and Tart VM
# symlink config.headless.toml via mise dotfiles instead to avoid Keychain/D-Bus failures).

import = ["./shared.toml"]

[providers.keychain]
type = "keychain"
service = "dotfiles-fnox"

[providers.age]
type = "age"
recipients = ["age16djrq9gc4kgdaxve0lua75q97qed6g858ec4s830hpry6nx8qalqns0x8d"]
identity = { provider = "keychain", value = "AGE_PRIVATE_KEY" }
