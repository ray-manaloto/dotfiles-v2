#:schema https://fnox.jdx.dev/schema.json
# Paid OpenCode proxy overlay; invoke via `opencode-paid` shell alias:
# `fnox --non-interactive -c ~/.config/fnox/opencode-paid.toml -P opencode-paid --no-defaults proxy run -- opencode --standalone`

# The host config comes first so its providers (Keychain, age, or pc's Doppler login) win over shared.toml.
import = ["./config.toml", "./shared.toml"]

[proxy]
egress = "permissive"
rules = [
  { secret = "OPENROUTER_API_KEY", domain = "openrouter.ai", header = "authorization" },
  { secret = "APINEX_API_KEY", domain = "api.apinex.bond", header = "authorization" },
  { secret = "EXPERIENTIAL_API_KEY", domain = "api.experientiallabs.ai", header = "authorization" },
  { secret = "RESPAN_API_KEY", domain = "gateway.respan.ai", header = "authorization" },
  { secret = "OPENCODE_API_KEY", domain = "opencode.ai", header = "authorization" },
  { secret = "NVIDIA_API_KEY", domain = "integrate.api.nvidia.com", header = "authorization" },
  { secret = "GEMINI_API_KEY", domain = "generativelanguage.googleapis.com", header = "x-goog-api-key" },
  { secret = "GEMINI_API_KEY", domain = "generativelanguage.googleapis.com", header = "authorization" },
  { secret = "GEMINI_API_KEY", domain = "generativelanguage.googleapis.com", query = "key" },
  { secret = "ZAI_API_KEY", domain = "api.z.ai", header = "authorization" },
  { secret = "KILO_API_KEY", domain = "api.kilo.ai", header = "authorization" },
  { secret = "OPENAI_COMPATIBLE_API_KEY", domain = "api.kilo.ai", header = "authorization" },
  { secret = "GROQ_API_KEY", domain = "api.groq.com", header = "authorization" },
  { secret = "AIHUBMIX_API_KEY", domain = "aihubmix.com", header = "authorization" },
  { secret = "CLOUDFLARE_API_KEY", domain = "api.cloudflare.com", header = "authorization" },
]
