[bootstrap.hooks.pre-dotfiles]
run = '''
if [ -z "${CI:-}" ] && [ "${DOTFILES_ALLOW_WORKTREE_DOTFILES:-}" != "1" ] && command -v git >/dev/null 2>&1; then
  for _df_raw_cfg in "{{ mise_config_dir }}" "{{ config_root }}"; do
    _df_cfg="$(cd "${_df_raw_cfg}" 2>/dev/null && pwd -P || true)"
    [ -n "${_df_cfg}" ] || continue
    _df_gd="$(git -C "${_df_cfg}" rev-parse --git-dir 2>/dev/null || true)"
    _df_cd="$(git -C "${_df_cfg}" rev-parse --git-common-dir 2>/dev/null || true)"
    case "${_df_gd}" in ""|/*) ;; *) _df_gd="${_df_cfg}/${_df_gd}" ;; esac
    case "${_df_cd}" in ""|/*) ;; *) _df_cd="${_df_cfg}/${_df_cd}" ;; esac
    _df_gd="$(cd "${_df_gd}" 2>/dev/null && pwd -P || printf '%s' "${_df_gd}")"
    _df_cd="$(cd "${_df_cd}" 2>/dev/null && pwd -P || printf '%s' "${_df_cd}")"
    if [ -n "${_df_gd}" ] && [ -n "${_df_cd}" ] && [ "${_df_gd}" != "${_df_cd}" ]; then
      _df_main="${_df_cd%/.git}"
      for _df_probe in "${HOME}/.config/mise" "${HOME}/.config/zsh/.zshrc" "${HOME}/.gemini/config/hooks/agy-pwf-guard.py"; do
        if [ -L "${_df_probe}" ]; then
          _df_pdir="$(cd "$(dirname "${_df_probe}")" 2>/dev/null && pwd -P)"
          _df_raw="$(readlink "${_df_probe}" 2>/dev/null || true)"
          case "${_df_raw}" in /*) _df_t="${_df_raw}" ;; *) _df_t="${_df_pdir}/${_df_raw}" ;; esac
          _df_tdir="$(cd "$(dirname "${_df_t}")" 2>/dev/null && pwd -P || true)"
          case "${_df_tdir}" in "${_df_main}"|"${_df_main}"/*)
            echo "Refusing to apply [dotfile_groups] from linked worktree (${_df_cfg}) while ${_df_probe} points into main checkout (${_df_main}); run from main checkout or set DOTFILES_ALLOW_WORKTREE_DOTFILES=1" >&2
            exit 1 ;;
          esac
        fi
      done
    fi
  done
fi
if [ -L ~/.claude/skills ]; then rm -f ~/.claude/skills; fi
mkdir -p ~/.agents/skills ~/.claude/skills
# Retire legacy ~/.gemini/GEMINI.md symlinks (only recognized legacy links; never delete user regular files).
if [ -L ~/.gemini/GEMINI.md ]; then
  _gem_md_raw="$(readlink ~/.gemini/GEMINI.md 2>/dev/null || true)"
  case "${_gem_md_raw}" in
    *"/.agents/AGENTS.md"*|*"/AGENTS.md"*|*"dotfiles-v2"*|*"/.gemini/config/AGENTS.md"*)
      rm -f ~/.gemini/GEMINI.md ;;
  esac
elif [ -e ~/.gemini/GEMINI.md ]; then
  echo "WARN: ~/.gemini/GEMINI.md is a non-symlink file; merge custom notes into ~/.agents/AGENTS.md and remove manually" >&2
fi
# Retire the legacy ~/.gemini/config/skills mirror: agy 1.5.16 discovers ~/.agents/skills natively.
if [ -L ~/.gemini/config/skills ]; then
  _gem_sk_raw="$(readlink ~/.gemini/config/skills 2>/dev/null || true)"
  case "${_gem_sk_raw}" in
    *"/.agents/skills"*|"../../.agents/skills"*|*"dotfiles-v2"*)
      rm -f ~/.gemini/config/skills ;;
    *)
      echo "WARN: leaving custom symlink ~/.gemini/config/skills -> ${_gem_sk_raw}" >&2 ;;
  esac
elif [ -d ~/.gemini/config/skills ]; then
  rm -f ~/.gemini/config/skills/.DS_Store
  for d in ~/.gemini/config/skills/*; do
    [ -e "$d" ] || [ -L "$d" ] || continue
    b="$(basename "$d")"
    # Omarchy's omarchy-agent-skills-link owns links to its bundled skills in every harness dir and
    # recreates them on each update; leave them alone.
    case "$(readlink "$d" 2>/dev/null || true)" in */omarchy/default/agents/skills/*) continue ;; esac
    if [ -d "$d" ] && [ ! -L "$d" ]; then rm -f "$d/.DS_Store"; fi
    _is_legacy=0
    if [ -L "$d" ]; then
      _dtgt="$(readlink "$d" 2>/dev/null || true)"
      case "${_dtgt}" in
        *"/.agents/skills/"*|*"../../.agents/skills/"*|*"dotfiles-v2"*"/.agents/skills/"*|*"/mise/installs/"*) _is_legacy=1 ;;
      esac
    elif [ -d "$d" ] && [ -L "$d/SKILL.md" ] && [ "$(ls -A "$d" | wc -l)" -eq 1 ]; then
      _stgt="$(readlink "$d/SKILL.md" 2>/dev/null || true)"
      case "${_stgt}" in
        *"/.agents/skills/"*|*"../../.agents/skills/"*|*"dotfiles-v2"*"/.agents/skills/"*|*"/mise/installs/"*) _is_legacy=1 ;;
      esac
    fi
    if [ "${_is_legacy}" -eq 1 ]; then
      rm -rf "$d"
    elif [ ! -e ~/.agents/skills/"$b" ] && [ ! -L ~/.agents/skills/"$b" ]; then
      mv "$d" ~/.agents/skills/"$b"
    fi
  done
  _gem_left=0
  for d in ~/.gemini/config/skills/* ~/.gemini/config/skills/.[!.]*; do
    { [ -e "$d" ] || [ -L "$d" ]; } || continue
    case "$(readlink "$d" 2>/dev/null || true)" in */omarchy/default/agents/skills/*) ;; *) _gem_left=1 ;; esac
  done
  if [ "${_gem_left}" -eq 1 ]; then
    echo "WARN: ~/.gemini/config/skills still holds non-migrated entries; inspect manually" >&2
  else
    rmdir ~/.gemini/config/skills 2>/dev/null || true
  fi
fi
'''

[bootstrap.directories."~/.claude"]
mode = "0700"

[bootstrap.directories."~/.codex"]
mode = "0700"

[bootstrap.directories."~/.codex/agents"]
mode = "0700"

[bootstrap.directories."~/.codex/rules"]
mode = "0700"

