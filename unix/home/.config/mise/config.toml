[bootstrap.hooks.pre-dotfiles]
run = 'if [ -L ~/.claude/skills ]; then rm -f ~/.claude/skills; fi && mkdir -p ~/.agents/skills ~/.claude/skills && if [ -d ~/.gemini/config/skills ] && [ ! -L ~/.gemini/config/skills ]; then rm -f ~/.gemini/config/skills/.DS_Store && for d in ~/.gemini/config/skills/*; do [ -e "$d" ] || [ -L "$d" ] || continue; b="$(basename "$d")"; if [ -d "$d" ] && [ ! -L "$d" ]; then rm -f "$d/.DS_Store"; fi; if [ -d "$d" ] && [ ! -L "$d" ] && [ -L "$d/SKILL.md" ] && [ "$(ls -A "$d" | wc -l)" -eq 1 ]; then rm -rf "$d"; elif [ ! -e ~/.agents/skills/"$b" ] && [ ! -L ~/.agents/skills/"$b" ]; then mv "$d" ~/.agents/skills/"$b"; fi; done && rmdir ~/.gemini/config/skills; fi'

[bootstrap.directories."~/.config/board"]
mode = "0700"

[bootstrap.directories."~/.config/last30days"]
mode = "0700"

[bootstrap.directories."~/.local/bin"]
mode = "0755"

[bootstrap.directories."~/.local/share/last30days/briefings.noindex"]
mode = "0755"
os = "macos"

[bootstrap.directories."~/.local/share/last30days/briefings"]
mode = "0755"
os = "linux"

[bootstrap.directories."~/.local/state/tailscale"]
mode = "0700"

[bootstrap.directories."~/.local/state/vercel-board.noindex"]
mode = "0700"
os = "macos"

[bootstrap.directories."~/.local/state/vercel-board"]
mode = "0700"
os = "linux"

[bootstrap.directories."~/.opencode/bin"]
mode = "0755"

[bootstrap.directories."~/.zcode"]
mode = "0755"

[bootstrap.directories."~/.zcode/cli"]
mode = "0755"

[bootstrap.directories."~/.zcode/v2"]
mode = "0700"

[tasks.bootstrap]
description = "Install idempotent native AI harness CLIs"
depends = [
  "bootstrap:claude",
  "bootstrap:opencode",
  "bootstrap:zcode",
  "bootstrap:skills",
]

[doctor.checks.gh-env-token]
description = "No stale GH_TOKEN or GITHUB_TOKEN overrides the gh login"
os = "macos"
run = '[ -f "$HOME/.config/dotfiles-v2/vm-env.sh" ] || [ "${container:-}" = "docker" ] || [ -z "${GH_TOKEN:-}${GITHUB_TOKEN:-}" ] || gh api user --silent'
hint = "A bad env token beats the keyring with no fallback. Unset it or restart this process; pass tokens only through fnox proxy run."
timeout = "15s"

[doctor.checks.gh-keyring]
description = "The stored gh login works without env tokens"
os = "macos"
run = '[ -f "$HOME/.config/dotfiles-v2/vm-env.sh" ] || [ "${container:-}" = "docker" ] || env -u GH_TOKEN -u GITHUB_TOKEN gh api user --silent'
hint = "Run `gh auth login`. Sandboxed agents without keychain access use agent-secrets."
timeout = "15s"

[doctor.checks.gh-scopes]
description = "The stored gh login has repo, workflow and read:org"
os = "macos"
run = '''[ -f "$HOME/.config/dotfiles-v2/vm-env.sh" ] || [ "${container:-}" = "docker" ] || [ "$(env -u GH_TOKEN -u GITHUB_TOKEN gh auth status --active --no-refresh --hostname github.com --json hosts --jq '.hosts["github.com"][]? | select(.active) | if .state == "success" and (["repo","workflow","read:org"] - (.scopes | split(", ")) | length) == 0 then "ok" else "missing" end')" = ok ]'''
hint = "Run `gh auth refresh -s repo,workflow,read:org`."
timeout = "15s"
depends = "gh-keyring"

[doctor.checks.gh-hosts-file]
description = "gh keeps its token in the keyring, not in hosts.yml"
os = "macos"
run = '[ -f "$HOME/.config/dotfiles-v2/vm-env.sh" ] || [ "${container:-}" = "docker" ] || [ ! -e ~/.config/gh/hosts.yml ] || ! grep -q oauth_token ~/.config/gh/hosts.yml'
hint = "Run `gh auth logout`, then `gh auth login` so the token moves to the keyring."

[doctor.checks.gh-ssh]
description = "SSH to GitHub authenticates"
os = "macos"
run = '[ -f "$HOME/.config/dotfiles-v2/vm-env.sh" ] || [ "${container:-}" = "docker" ] || ssh -T -o BatchMode=yes -o ConnectTimeout=8 git@github.com 2>&1 | grep -q "successfully authenticated"'
hint = "Check your SSH key in the agent and on GitHub."
timeout = "15s"

[settings]
auto_install_disable_tools = [
  "agy",
  "antigravity-cli",
  "aqua:anomalyco/opencode",
  "aqua:anthropics/claude-code",
  "aqua:jdx/mise",
  "aqua:openai/codex",
  "aqua:sst/opencode",
  "claude",
  "claude-code",
  "codex",
  "github:anomalyco/opencode",
  "github:anthropics/claude-code",
  "github:jdx/mise",
  "github:openai/codex",
  "github:sst/opencode",
  "mise",
  "npm:@anthropic-ai/claude-code",
  "npm:@openai/codex",
  "npm:@opencode-ai/cli",
  "npm:@opencode/cli",
  "npm:antigravity-cli",
  "npm:opencode-ai",
  "opencode",
]
disable_tools = [
  "agy",
  "antigravity-cli",
  "aqua:anomalyco/opencode",
  "aqua:anthropics/claude-code",
  "aqua:jdx/mise",
  "aqua:openai/codex",
  "aqua:sst/opencode",
  "claude",
  "claude-code",
  "codex",
  "github:anomalyco/opencode",
  "github:anthropics/claude-code",
  "github:jdx/mise",
  "github:openai/codex",
  "github:sst/opencode",
  "mise",
  "npm:@anthropic-ai/claude-code",
  "npm:@openai/codex",
  "npm:@opencode-ai/cli",
  "npm:@opencode/cli",
  "npm:antigravity-cli",
  "npm:opencode-ai",
  "opencode",
]
dotfiles.root = "{{ config_source | canonicalize | dirname }}/../.."
download_cache = true
download_cache_max_size = "10GiB"
enable_backends = ["core", "aqua", "github", "npm", "packslip"]
exec_auto_install = false
experimental = true
github.credential_command = "gh auth token"
lockfile = true
lockfile_platforms = ["linux-arm64", "linux-x64", "macos-arm64"]
paranoid = ["config"]
pin = true
prune.forget_unused_after = "30d"
task.history = true
trusted_config_paths = [
  "~/.config/mise",
  "~/dev/github/ray-manaloto",
  "~/.codex/worktrees",
  "~/dev/dotfiles-v2",
]

[settings.npm]
package_manager = "aube"

[settings.python]
compile = false

[settings.skills]
auto_sync = true
prune = true
