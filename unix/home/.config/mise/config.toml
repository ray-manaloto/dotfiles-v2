[vars]
last30days_config_dir = "{{ [xdg_config_home, 'last30days'] | join_path }}"
last30days_memory_dir = "{% if os() == 'macos' %}{{ [xdg_data_home, 'last30days', 'briefings.noindex'] | join_path }}{% else %}{{ [xdg_data_home, 'last30days', 'briefings'] | join_path }}{% endif %}"

[env]
# Never set DO_NOT_TRACK / DISABLE_TELEMETRY here: Claude Code skips feature-flag fetching and
# drops /ship and /steward (config-hygiene enforces this). Repowise uses its own opt-out below.
GIT_TERMINAL_PROMPT = "0"
LAST30DAYS_CONFIG_DIR = "{{ vars.last30days_config_dir }}"
LAST30DAYS_MEMORY_DIR = "{{ vars.last30days_memory_dir }}"
# YouTube search and transcripts via local yt-dlp only, so an empty ScrapeCreators balance (HTTP 402)
# cannot take YouTube down with it (last30days env.py LAST30DAYS_YOUTUBE_BACKEND; only valid value).
LAST30DAYS_YOUTUBE_BACKEND = "yt-dlp"
# mise manages OpenAI CLI upgrades.
OPENAI_CLI_NO_AUTO_UPDATE = "1"
REPOWISE_TELEMETRY_DISABLED = "1"
UV_SYSTEM_CERTS = "1"
VCPKG_DISABLE_METRICS = "1"
VCPKG_ROOT = { value = "{% if tools['github:microsoft/vcpkg-tool'] is defined %}{{ tools['github:microsoft/vcpkg-tool'].path }}{% endif %}", tools = true }
XDG_CACHE_HOME = "{{ xdg_cache_home }}"
XDG_CONFIG_HOME = "{{ xdg_config_home }}"
XDG_DATA_HOME = "{{ xdg_data_home }}"
XDG_STATE_HOME = "{{ xdg_state_home }}"

[hooks]
# Note: during `mise upgrade --bump`, mise runs `postinstall` inside install_all_versions
# before reloading updated config.toml for its final auto_sync_skills pass.
postinstall = [{ task = "bootstrap:skills" }, { task = "host:harden-bins" }]

[wrappers.agentsview]
command = "{{env.HOME}}/.local/bin/agentsview"

[wrappers.board]
command = "{{env.HOME}}/.local/bin/board"

[wrappers.vb]
command = "{{env.HOME}}/.local/bin/vb"

[shell_alias]
opencode-paid = "fnox --non-interactive -c ~/.config/fnox/opencode-paid.toml -P opencode-paid --no-defaults proxy run -- opencode --standalone"

[dotfile_groups.gemini-hooks]
root = ".gemini/config/hooks"
target = "~/.gemini/config/hooks"
mode = "symlink-each"
exclude = ["ruff.toml", "__pycache__", "*.pyc", ".DS_Store"]

[dotfile_groups.gemini-rules]
root = ".gemini/config/rules"
target = "~/.gemini/config/rules"
mode = "symlink-each"
exclude = [".DS_Store"]

[dotfile_groups.zsh]
root = ".config/zsh"
target = "~/.config/zsh"
mode = "symlink-each"
exclude = [".DS_Store"]

[dotfile_groups.jouet-rules]
root = ".config/jouet/rules"
target = "~/.config/jouet/rules"
mode = "symlink-each"
exclude = [".DS_Store"]

[dotfile_groups.agents-skills]
root = ".agents/skills"
target = "~/.agents/skills"
mode = "symlink-each"
exclude = ["*"]

