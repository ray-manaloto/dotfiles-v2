mode = "0755"

[bootstrap.directories."~/.zcode/v2"]
mode = "0700"

[tasks.bootstrap]
description = "Install idempotent native AI harness CLIs"
depends = [
  "bootstrap:claude",
  "bootstrap:codex",
  "bootstrap:reviewer-plugins",
  "bootstrap:herdr-app",
  "bootstrap:herdr-core",
  "bootstrap:herdr-mods",
  "bootstrap:opencode",
  "bootstrap:zcode",
  "bootstrap:skills",
]

[doctor.checks.gh-env-token]
description = "No stale GH_TOKEN or GITHUB_TOKEN overrides the gh login"
os = "macos"
run = '[ -f "$HOME/.config/dotfiles-v2/vm-env.sh" ] || [ "${container:-}" = "docker" ] || [ -z "${GH_TOKEN:-}${GITHUB_TOKEN:-}" ] || gh api user --silent'
hint = "A bad env token beats the keyring with no fallback. Unset it or restart this process; pass tokens only through fnox proxy run."
timeout = "15s"

[doctor.checks.gh-keyring]
description = "The stored gh login works without env tokens"
os = "macos"
run = '[ -f "$HOME/.config/dotfiles-v2/vm-env.sh" ] || [ "${container:-}" = "docker" ] || env -u GH_TOKEN -u GITHUB_TOKEN gh api user --silent'
hint = "Run `gh auth login`. Sandboxed agents without keychain access use agent-secrets."
timeout = "15s"

[doctor.checks.gh-scopes]
description = "The stored gh login has repo, workflow and read:org"
os = "macos"
run = '''[ -f "$HOME/.config/dotfiles-v2/vm-env.sh" ] || [ "${container:-}" = "docker" ] || [ "$(env -u GH_TOKEN -u GITHUB_TOKEN gh auth status --active --no-refresh --hostname github.com --json hosts --jq '.hosts["github.com"][]? | select(.active) | if .state == "success" and (["repo","workflow","read:org"] - (.scopes | split(", ")) | length) == 0 then "ok" else "missing" end')" = ok ]'''
hint = "Run `gh auth refresh -s repo,workflow,read:org`."
timeout = "15s"
depends = "gh-keyring"

[doctor.checks.gh-hosts-file]
description = "gh keeps its token in the keyring, not in hosts.yml"
os = "macos"
run = '[ -f "$HOME/.config/dotfiles-v2/vm-env.sh" ] || [ "${container:-}" = "docker" ] || [ ! -e ~/.config/gh/hosts.yml ] || ! grep -q oauth_token ~/.config/gh/hosts.yml'
hint = "Run `gh auth logout`, then `gh auth login` so the token moves to the keyring."

[doctor.checks.gh-ssh]
description = "SSH to GitHub authenticates"
os = "macos"
run = '[ -f "$HOME/.config/dotfiles-v2/vm-env.sh" ] || [ "${container:-}" = "docker" ] || ssh -T -o BatchMode=yes -o ConnectTimeout=8 git@github.com 2>&1 | grep -q "successfully authenticated"'
hint = "Check your SSH key in the agent and on GitHub."
timeout = "15s"

[settings]
