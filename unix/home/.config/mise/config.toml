#:schema https://mise.jdx.dev/schema/mise.json
# ref: https://mise.jdx.dev/configuration.html

min_version = "2026.11.12"

[tools]
"aqua:owenlamont/ryl" = "0.30.0"
"aqua:oxc-project/oxc/oxfmt" = "0.79.0"
betterleaks = "1.10.1"
fnox = "1.50.0"
hadolint = "2.15.1"
hk = "2.13.0"
pkl = "0.33.1"
rumdl = "0.3.5"
shellcheck = "0.11.0"
shfmt = "3.14.1"
tombi = "1.11.3"
typos = "1.52.2"

[settings]
auto_install_disable_tools = [
  "aqua:anomalyco/opencode",
  "aqua:anthropics/claude-code",
  "aqua:sst/opencode",
  "claude",
  "claude-code",
  "github:anomalyco/opencode",
  "github:anthropics/claude-code",
  "github:sst/opencode",
  "npm:@anthropic-ai/claude-code",
  "npm:@opencode-ai/cli",
  "npm:@opencode/cli",
  "npm:opencode-ai",
  "opencode",
]
disable_tools = [
  "aqua:anomalyco/opencode",
  "aqua:anthropics/claude-code",
  "aqua:sst/opencode",
  "claude",
  "claude-code",
  "github:anomalyco/opencode",
  "github:anthropics/claude-code",
  "github:sst/opencode",
  "npm:@anthropic-ai/claude-code",
  "npm:@opencode-ai/cli",
  "npm:@opencode/cli",
  "npm:opencode-ai",
  "opencode",
]
exec_auto_install = false
experimental = true
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64"]

[settings.skills]
auto_sync = true
prune = true
