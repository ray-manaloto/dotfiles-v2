"~/.gemini/config/rules/planning-with-files-agy.md" = { mode = "symlink", main_checkout = true }
"~/.gemini/config/rules/research-due-diligence.md" = { mode = "symlink", main_checkout = true }
"~/.gemini/config/rules/skill-cutoff-agy.md" = { mode = "symlink", main_checkout = true }
