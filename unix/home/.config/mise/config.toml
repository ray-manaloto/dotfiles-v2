#:schema https://mise.jdx.dev/schema/mise.json
# ref: https://mise.jdx.dev/configuration.html

min_version = "2026.11.12"

[tools]
"aqua:jdx/jactionlint" = "2.6.0"
"aqua:owenlamont/ryl" = "0.30.0"
"aqua:oxc-project/oxc/oxfmt" = "0.79.0"
"aqua:zizmorcore/zizmor" = "1.33.0"
betterleaks = "1.10.1"
fnox = "1.50.0"
"github:agent-sh/agnix" = "0.61.0"
github-cli = "2.105.0"
hadolint = "2.15.1"
hk = "2.13.0"
node = "26.13.1"
"npm:openwiki" = { version = "0.9.0", allow_builds = ["better-sqlite3"] }
pkl = "0.33.1"
python = "3.15.2"
ruff = "0.17.6"
rumdl = "0.3.5"
shellcheck = "0.11.0"
shfmt = "3.14.1"
tailscale = { version = "1.104.7", os = ["linux"] }
tombi = "1.11.3"
ty = "0.0.108"
typos = "1.52.2"
uv = "0.13.9"

[vars]
last30days_config_dir = "{{ [xdg_config_home, 'last30days'] | join_path }}"
last30days_memory_dir = "{% if os() == 'macos' %}{{ [xdg_data_home, 'last30days', 'briefings.noindex'] | join_path }}{% else %}{{ [xdg_data_home, 'last30days', 'briefings'] | join_path }}{% endif %}"

[env]
LAST30DAYS_CONFIG_DIR = "{{ vars.last30days_config_dir }}"
LAST30DAYS_MEMORY_DIR = "{{ vars.last30days_memory_dir }}"
XDG_CACHE_HOME = "{{ xdg_cache_home }}"
XDG_CONFIG_HOME = "{{ xdg_config_home }}"
XDG_DATA_HOME = "{{ xdg_data_home }}"
XDG_STATE_HOME = "{{ xdg_state_home }}"

[dotfiles]
"~/.config/agent-secrets/env.sh" = { mode = "symlink" }
"~/.config/agents/AGENTS.md" = { mode = "symlink" }
"~/.config/opencode/AGENTS.md" = { source = "../agents/AGENTS.md", mode = "symlink" }
"~/.config/opencode/opencode.json" = { mode = "symlink" }
"~/.gemini/GEMINI.md" = { source = "../agents/AGENTS.md", mode = "symlink" }
"~/.gemini/config/hooks.json/dotfiles-v2" = { merge = true }
"~/.gemini/config/hooks/agy-interactive-questions.py" = { mode = "symlink" }
"~/.gemini/config/hooks/agy-pwf-guard.py" = { mode = "symlink" }
"~/.gemini/config/hooks/agy-skill-cutoff.py" = { mode = "symlink" }
"~/.gemini/config/hooks/post-task-learn.py" = { mode = "symlink" }
"~/.gemini/config/rules/interactive-questions.md" = { mode = "symlink" }
"~/.gemini/config/rules/planning-with-files-agy.md" = { mode = "symlink" }
"~/.gemini/config/rules/research-due-diligence.md" = { mode = "symlink" }
"~/.gemini/config/rules/skill-cutoff-agy.md" = { mode = "symlink" }
"~/.gemini/config/skills/agy-session-ops/SKILL.md" = { mode = "symlink" }
"~/.gemini/config/skills/mise-bootstrap-ops/SKILL.md" = { mode = "symlink" }
"~/.gemini/config/skills/post-task-learn/SKILL.md" = { mode = "symlink" }
"~/.gemini/config/skills/pwf-status/SKILL.md" = { mode = "symlink" }

[bootstrap.directories."~/.config/last30days"]
mode = "0700"

[bootstrap.directories."~/.local/bin"]
mode = "0755"

[bootstrap.directories."~/.local/share/last30days/briefings.noindex"]
mode = "0755"
os = "macos"

[bootstrap.directories."~/.local/share/last30days/briefings"]
mode = "0755"
os = "linux"

[bootstrap.directories."~/.local/state/tailscale"]
mode = "0700"

[bootstrap.directories."~/.opencode/bin"]
mode = "0755"

[tasks.bootstrap]
description = "Install idempotent native AI harness CLIs"
depends = ["bootstrap:claude", "bootstrap:opencode"]

[settings]
auto_install_disable_tools = [
  "agy",
  "antigravity-cli",
  "aqua:anomalyco/opencode",
  "aqua:anthropics/claude-code",
  "aqua:jdx/mise",
  "aqua:openai/codex",
  "aqua:sst/opencode",
  "claude",
  "claude-code",
  "codex",
  "github:anomalyco/opencode",
  "github:anthropics/claude-code",
  "github:jdx/mise",
  "github:openai/codex",
  "github:sst/opencode",
  "mise",
  "npm:@anthropic-ai/claude-code",
  "npm:@openai/codex",
  "npm:@opencode-ai/cli",
  "npm:@opencode/cli",
  "npm:antigravity-cli",
  "npm:opencode-ai",
  "opencode",
]
disable_tools = [
  "agy",
  "antigravity-cli",
  "aqua:anomalyco/opencode",
  "aqua:anthropics/claude-code",
  "aqua:jdx/mise",
  "aqua:openai/codex",
  "aqua:sst/opencode",
  "claude",
  "claude-code",
  "codex",
  "github:anomalyco/opencode",
  "github:anthropics/claude-code",
  "github:jdx/mise",
  "github:openai/codex",
  "github:sst/opencode",
  "mise",
  "npm:@anthropic-ai/claude-code",
  "npm:@openai/codex",
  "npm:@opencode-ai/cli",
  "npm:@opencode/cli",
  "npm:antigravity-cli",
  "npm:opencode-ai",
  "opencode",
]
dotfiles.root = "{{ config_source | canonicalize | dirname }}/../.."
download_cache = true
download_cache_max_size = "10GiB"
exec_auto_install = false
experimental = true
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64"]

[settings.npm]
package_manager = "aube"

[settings.python]
compile = false

[settings.skills]
auto_sync = true
prune = true
