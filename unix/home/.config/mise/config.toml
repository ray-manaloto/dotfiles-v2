#:schema https://mise.jdx.dev/schema/mise.json
# ref: https://mise.jdx.dev/configuration.html

min_version = "2026.11.12"

[tools]
"aqua:jdx/jactionlint" = "2.6.0"
"aqua:owenlamont/ryl" = "0.30.0"
"aqua:oxc-project/oxc/oxfmt" = "0.79.0"
"aqua:zizmorcore/zizmor" = "1.33.0"
aube = { version = "2.10.1", workflow = [
  "release-plz.yml@refs/heads/main",
  "release.yml@refs/heads/main",
] }
betterleaks = "1.10.1"
communique = { version = "1.8.0", workflow = "release.yml@refs/heads/main" }
fnox = { version = "1.50.0", workflow = "release.yml" }
"github:agent-sh/agnix" = "0.61.0"
github-cli = "2.105.0"
hadolint = "2.15.1"
hk = { version = "2.13.0", workflow = "release.yml" }
node = "26.13.1"
"npm:@vercel/board" = "0.54.1"
"npm:openwiki" = { version = "0.9.0", allow_builds = ["better-sqlite3"] }
"npm:zcode-app-cli" = "3.18.2-48"
"packslip:grafana/flint" = "0.22.15"
pitchfork = { version = "2.36.0", workflow = "release.yml@refs/heads/main" }
pkl = "0.33.1"
python = "3.15.2"
ruff = "0.17.6"
rumdl = "0.3.5"
shellcheck = "0.11.0"
shfmt = "3.14.1"
tailscale = { version = "1.104.7", os = ["linux"] }
tombi = "1.11.3"
ty = "0.0.108"
typos = "1.52.2"
usage = { version = "7.4.0", workflow = "publish-cli.yml" }
uv = "0.13.9"

[vars]
last30days_config_dir = "{{ [xdg_config_home, 'last30days'] | join_path }}"
last30days_memory_dir = "{% if os() == 'macos' %}{{ [xdg_data_home, 'last30days', 'briefings.noindex'] | join_path }}{% else %}{{ [xdg_data_home, 'last30days', 'briefings'] | join_path }}{% endif %}"

[env]
LAST30DAYS_CONFIG_DIR = "{{ vars.last30days_config_dir }}"
LAST30DAYS_MEMORY_DIR = "{{ vars.last30days_memory_dir }}"
XDG_CACHE_HOME = "{{ xdg_cache_home }}"
XDG_CONFIG_HOME = "{{ xdg_config_home }}"
XDG_DATA_HOME = "{{ xdg_data_home }}"
XDG_STATE_HOME = "{{ xdg_state_home }}"

[dotfiles]
"~/.config/agent-secrets/env.sh" = { mode = "symlink" }
"~/.config/agents/AGENTS.md" = { mode = "symlink" }
"~/.config/opencode/AGENTS.md" = { source = "../agents/AGENTS.md", mode = "symlink" }
"~/.config/opencode/opencode.json" = { mode = "symlink" }
"~/.gemini/GEMINI.md" = { source = "../agents/AGENTS.md", mode = "symlink" }
"~/.gemini/config/hooks.json/dotfiles-v2" = { merge = true }
"~/.gemini/config/hooks/agy-hc-send-guard.py" = { mode = "symlink" }
"~/.gemini/config/hooks/agy-interactive-questions.py" = { mode = "symlink" }
"~/.gemini/config/hooks/agy-pwf-guard.py" = { mode = "symlink" }
"~/.gemini/config/hooks/agy-skill-cutoff.py" = { mode = "symlink" }
"~/.gemini/config/hooks/post-task-learn.py" = { mode = "symlink" }
"~/.gemini/config/rules/agy-peer-messaging.md" = { mode = "symlink" }
"~/.gemini/config/rules/interactive-questions.md" = { mode = "symlink" }
"~/.gemini/config/rules/planning-with-files-agy.md" = { mode = "symlink" }
"~/.gemini/config/rules/research-due-diligence.md" = { mode = "symlink" }
"~/.gemini/config/rules/skill-cutoff-agy.md" = { mode = "symlink" }
"~/.agents/skills/agy-session-ops" = { mode = "symlink" }
"~/.agents/skills/mise-bootstrap-ops" = { mode = "symlink" }
"~/.agents/skills/post-task-learn" = { mode = "symlink" }
"~/.agents/skills/pwf-status" = { mode = "symlink" }
"~/.agents/skills/vercel-board" = { mode = "symlink" }
"~/.claude.json/mcp-jdx" = { source = "../../.claude.mcp-jdx.json", merge = true, permissions = "0600" }
"~/.claude/skills/agy-session-ops" = { source = "../../.agents/skills/agy-session-ops", mode = "symlink" }
"~/.claude/skills/mise-bootstrap-ops" = { source = "../../.agents/skills/mise-bootstrap-ops", mode = "symlink" }
"~/.claude/skills/post-task-learn" = { source = "../../.agents/skills/post-task-learn", mode = "symlink" }
"~/.claude/skills/pwf-status" = { source = "../../.agents/skills/pwf-status", mode = "symlink" }
"~/.claude/skills/vercel-board" = { source = "../../.agents/skills/vercel-board", mode = "symlink" }
"~/.codex/config.toml/mcp-jdx" = { source = "../../.codex/mcp-jdx.toml", merge = true, permissions = "0600" }
"~/.gemini/config/skills" = { source = "~/.agents/skills", mode = "symlink", relative = true }
"~/.zcode/AGENTS.md" = { source = "../agents/AGENTS.md", mode = "symlink" }
"~/.zcode/cli/setting.json" = { mode = "symlink" }

[bootstrap.hooks.pre-dotfiles]
run = 'mkdir -p ~/.agents/skills ~/.claude/skills && if [ -d ~/.gemini/config/skills ] && [ ! -L ~/.gemini/config/skills ]; then rm -rf ~/.gemini/config/skills; fi'

[bootstrap.directories."~/.config/board"]
mode = "0700"

[bootstrap.directories."~/.config/last30days"]
mode = "0700"

[bootstrap.directories."~/.local/bin"]
mode = "0755"

[bootstrap.directories."~/.local/share/last30days/briefings.noindex"]
mode = "0755"
os = "macos"

[bootstrap.directories."~/.local/share/last30days/briefings"]
mode = "0755"
os = "linux"

[bootstrap.directories."~/.local/state/tailscale"]
mode = "0700"

[bootstrap.directories."~/.local/state/vercel-board.noindex"]
mode = "0700"
os = "macos"

[bootstrap.directories."~/.local/state/vercel-board"]
mode = "0700"
os = "linux"

[bootstrap.directories."~/.opencode/bin"]
mode = "0755"

[bootstrap.directories."~/.zcode"]
mode = "0755"

[bootstrap.directories."~/.zcode/cli"]
mode = "0755"

[bootstrap.directories."~/.zcode/v2"]
mode = "0700"

[tasks.bootstrap]
description = "Install idempotent native AI harness CLIs"
depends = [
  "bootstrap:claude",
  "bootstrap:opencode",
  "bootstrap:zcode",
  "bootstrap:skills",
]

[settings]
auto_install_disable_tools = [
  "agy",
  "antigravity-cli",
  "aqua:anomalyco/opencode",
  "aqua:anthropics/claude-code",
  "aqua:jdx/mise",
  "aqua:openai/codex",
  "aqua:sst/opencode",
  "claude",
  "claude-code",
  "codex",
  "github:anomalyco/opencode",
  "github:anthropics/claude-code",
  "github:jdx/mise",
  "github:openai/codex",
  "github:sst/opencode",
  "mise",
  "npm:@anthropic-ai/claude-code",
  "npm:@openai/codex",
  "npm:@opencode-ai/cli",
  "npm:@opencode/cli",
  "npm:antigravity-cli",
  "npm:opencode-ai",
  "opencode",
]
disable_tools = [
  "agy",
  "antigravity-cli",
  "aqua:anomalyco/opencode",
  "aqua:anthropics/claude-code",
  "aqua:jdx/mise",
  "aqua:openai/codex",
  "aqua:sst/opencode",
  "claude",
  "claude-code",
  "codex",
  "github:anomalyco/opencode",
  "github:anthropics/claude-code",
  "github:jdx/mise",
  "github:openai/codex",
  "github:sst/opencode",
  "mise",
  "npm:@anthropic-ai/claude-code",
  "npm:@openai/codex",
  "npm:@opencode-ai/cli",
  "npm:@opencode/cli",
  "npm:antigravity-cli",
  "npm:opencode-ai",
  "opencode",
]
dotfiles.root = "{{ config_source | canonicalize | dirname }}/../.."
download_cache = true
download_cache_max_size = "10GiB"
exec_auto_install = false
experimental = true
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64"]
pin = true
task.history = true

[settings.npm]
package_manager = "aube"

[settings.python]
compile = false

[settings.skills]
auto_sync = true
prune = true
