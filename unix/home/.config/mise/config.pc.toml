#:schema https://mise.jdx.dev/schema/mise.json

[settings]
upgrade.auto_prune = true
upgrade.prune_after = "24h"

[env]
FNOX_AGE_KEY_FILE = "{{ env.HOME }}/.config/fnox/age.txt"

[bootstrap.packages]
"pacman:zsh" = "latest"
"pacman:lm_sensors" = "latest"
"pacman:nvme-cli" = "latest"
"pacman:nvidia-container-toolkit" = "latest"

# Runner and host services ported from cpp-standard (6eec09e).
# Apply a firewall change only with the runner slots drained. Files do not
# notify services, so routine bootstrap cannot restart active slots or the fence.
[bootstrap.files."/etc/systemd/system/gha-slot@.service"]
os = "linux"
source = "assets/pc/gha-slot@.service"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/etc/systemd/system/gha-fence.service"]
os = "linux"
source = "assets/pc/gha-fence.service"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/etc/gha-runner/fence.rules"]
os = "linux"
source = "assets/pc/fence.rules"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/etc/gha-runner/fence6.rules"]
os = "linux"
source = "assets/pc/fence6.rules"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/etc/ufw/before.rules"]
os = "linux"
source = "assets/pc/ufw-before.rules"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/etc/ufw/after.rules"]
os = "linux"
source = "assets/pc/ufw-after.rules"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/etc/systemd/system/acu-trial.service"]
os = "linux"
source = "assets/pc/acu-trial.service"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/usr/local/sbin/gha-slot"]
os = "linux"
source = "assets/pc/gha-slot"
owner = "root"
group = "root"
mode = "0755"

[bootstrap.files."~/.local/bin/agent-secrets"]
os = "linux"
source = "assets/pc/agent-secrets.bash"
mode = "0755"

# The package provides the units in /usr/lib/systemd/system. Keep only the
# dynamically refreshed CDI spec in /run/cdi.
[bootstrap.files."/etc/cdi/nvidia.yaml"]
os = "linux"
state = "absent"

[bootstrap.services."gha-fence.service"]
state = "running"
enabled = true

[bootstrap.services.ufw]
state = "running"
enabled = true

[bootstrap.services."gha-slot@glaze"]
state = "running"
enabled = true

[bootstrap.services."gha-slot@cpp-utilities"]
state = "running"
enabled = true

[bootstrap.services."gha-slot@dotfiles"]
state = "running"
enabled = true

[bootstrap.services."gha-slot@hft-challenges-prototype"]
state = "running"
enabled = true

[bootstrap.services."gha-slot@knowledge-base-v2"]
state = "running"
enabled = true

[bootstrap.services."acu-trial.service"]
state = "running"
enabled = true

[bootstrap.services."nvidia-cdi-refresh.path"]
state = "running"
enabled = true

# The oneshot finishes inactive after a successful run.
[bootstrap.services."nvidia-cdi-refresh.service"]
state = "stopped"
enabled = true

# Hardware monitoring and cooling. The oneshot monitor services are static.
# Keep cooling restarts explicit. Restore the private notification helpers
# before enabling timers on a rebuilt host.
[bootstrap.files."/usr/local/sbin/hw-watch"]
os = "linux"
source = "assets/pc/hw-watch"
owner = "root"
group = "root"
mode = "0755"

[bootstrap.files."/usr/local/sbin/h1-pump-full"]
os = "linux"
source = "assets/pc/h1-pump-full"
owner = "root"
group = "root"
mode = "0755"

[bootstrap.files."/usr/local/sbin/h1-radfan-curve"]
os = "linux"
source = "assets/pc/h1-radfan-curve"
owner = "root"
group = "root"
mode = "0755"

[bootstrap.files."/etc/systemd/system/hw-watch.service"]
os = "linux"
source = "assets/pc/hw-watch.service"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/etc/systemd/system/hw-watch.timer"]
os = "linux"
source = "assets/pc/hw-watch.timer"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/etc/systemd/system/hw-heartbeat.service"]
os = "linux"
source = "assets/pc/hw-heartbeat.service"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/etc/systemd/system/hw-heartbeat.timer"]
os = "linux"
source = "assets/pc/hw-heartbeat.timer"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/etc/systemd/system/h1-pump-full.service"]
os = "linux"
source = "assets/pc/h1-pump-full.service"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/etc/systemd/system/h1-radfan-curve.service"]
os = "linux"
source = "assets/pc/h1-radfan-curve.service"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/etc/modules-load.d/nct6775.conf"]
os = "linux"
source = "assets/pc/nct6775.conf"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.services."h1-pump-full.service"]
state = "running"
enabled = true

[bootstrap.services."h1-radfan-curve.service"]
state = "running"
enabled = true

[bootstrap.services."hw-watch.timer"]
state = "running"
enabled = true

[bootstrap.services."hw-heartbeat.timer"]
state = "running"
enabled = true

[bootstrap.services.agent-secrets]
scope = "user"
command = "~/.local/bin/agent-secrets serve"
description = "Short-lived GitHub tokens and agent keys for project agent containers (cpp-standard D155)"
restart = "always"
requires_tools = true
environment = { PATH = "/usr/local/bin:/usr/bin:/bin", MISE_SYSTEM_CONFIG_DIR = "/nonexistent", MISE_ENV = "linux,pc" }

[dotfiles]
"~/.bashrc/dotfiles-v2" = { line = '[ -r "${HOME}/.config/dotfiles-v2/pc-env.sh" ] && . "${HOME}/.config/dotfiles-v2/pc-env.sh"', position = "prepend" }
"~/.config/dotfiles-v2/pc-env.sh/mise-env" = { line = "export MISE_ENV=linux,pc" }
"~/.config/dotfiles-v2/pc-env.sh/mise-system-config-dir" = { line = "export MISE_SYSTEM_CONFIG_DIR=/nonexistent" }
"~/.config/fnox/config.toml" = { source = "~/.config/fnox/config.headless.toml", main_checkout = true, depends = [
  "~/.config/fnox/config.headless.toml",
] }
"~/.profile/dotfiles-v2" = { line = '[ -r "${HOME}/.config/dotfiles-v2/pc-env.sh" ] && . "${HOME}/.config/dotfiles-v2/pc-env.sh"', position = "append" }
