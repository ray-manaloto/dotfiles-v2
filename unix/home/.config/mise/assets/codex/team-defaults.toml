# Declarative Codex 0.172.0 routing defaults merged into ~/.codex/config.toml via mise dotfiles.
# Paired with standalone V2 profiles ($CODEX_HOME/{sol,astra,luna,review}.config.toml) and
# Starlark execpolicy rules (~/.codex/rules/{guards,workflow}.rules).
# Routing only (owner decision 2026-11-25): sandbox_mode / approval_policy stay host-owned and are
# deliberately NOT set here so watched Herdr Codex tabs keep their current behavior.

model = "gpt-6.2-sol"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "medium"

[features]
multi_agent_v2 = true

[agents]
enabled = true
max_concurrent_threads_per_session = 6
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "high"
