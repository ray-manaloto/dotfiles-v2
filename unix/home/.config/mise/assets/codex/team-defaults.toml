#:schema https://raw.githubusercontent.com/openai/codex/rust-v0.172.0/codex-rs/core/config.schema.json
# Declarative Codex 0.172.0 routing defaults merged into ~/.codex/config.toml via mise dotfiles.
# Paired with standalone V2 profiles ($CODEX_HOME/{sol,astra,luna,review}.config.toml) and
# Starlark execpolicy rules (~/.codex/rules/{guards,workflow}.rules).
# Routing only (owner decision 2026-11-25): sandbox_mode / approval_policy stay host-owned and are
# deliberately NOT set here so watched Herdr Codex tabs keep their current behavior.

model = "gpt-6.2-sol"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "medium"
# `/review` model (docs: defaults to the session model); keep reviews on sol, spare astra.
review_model = "gpt-6.2-sol"

[features]
multi_agent_v2 = true

# Owner decision 2026-11-26: Codex never imports Claude Code / Cowork config, plugins, sessions or
# skills. The ChatGPT desktop "Keep imports in sync" re-added Claude marketplaces on 11-23 and 11-25.
# Pin the master switch and every item type off; `codex-marketplaces` doctor check enforces it.
[desktop]
external-agent-import-sync-enabled = false

[desktop.external-agent-import-sync-item-types]
AGENTS_MD = false
COMMANDS = false
CONFIG = false
HOOKS = false
MCP_SERVER_CONFIG = false
PLUGINS = false
SESSIONS = false
SKILLS = false
SUBAGENTS = false

[agents]
enabled = true
max_concurrent_threads_per_session = 6
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "high"
