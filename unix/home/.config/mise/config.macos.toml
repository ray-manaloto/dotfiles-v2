#:schema https://mise.jdx.dev/schema/mise.json
# Loaded automatically on macOS via miserc.toml (auto_env = true).
# Host-only settings (`programs.json`, `HERMES_TUI_DIR`) are deselected/unset on the Tart VM
# by config.vm.toml + 90-mise.zsh.

[env]
HERMES_TUI_DIR = "{{ env.HOME }}/.local/share/hermes-cli.noindex/tui"
HOMEBREW_PREFIX = "{{ system_brew_prefix }}"

[env._]
path = [
  "~/.config/mise/apple-bin",
  "$HOMEBREW_PREFIX/opt/llvm/bin",
  "$HOMEBREW_PREFIX/opt/lldb/bin",
  "$HOMEBREW_PREFIX/opt/make/libexec/gnubin",
]

[dotfile_groups.macos-host]
root = "."
target = "~"
mode = "symlink-each"
exclude = ["*"]

[dotfile_groups.macos-host.entries]
"~/.config/herdr-app/programs.json" = { source = ".config/herdr-app/programs.json", mode = "symlink", main_checkout = true }

[dotfile_groups.herdr-env-stats]
root = ".config/herdr-app/mods/env-stats"
target = "~/.config/herdr-app/mods/env-stats"
mode = "copy"
exclude = ["gpui-kit.d.ts", "jsconfig.json", ".DS_Store"]

[shell_alias]
df-pc = "mise -C ~ run env:enter pc"
df-mac = "mise -C ~ run env:enter mac"
df-vm = "mise -C ~ run env:enter vm"
df-pc-exec = "mise -C ~ run env:enter --exec pc"
df-mac-exec = "mise -C ~ run env:enter --exec mac"
df-vm-exec = "mise -C ~ run env:enter --exec vm"
kb-pc = "mise -C ~ run env:enter -p kb-v2 pc"
kb-mac = "mise -C ~ run env:enter -p kb-v2 mac"
cpp-pc = "mise -C ~ run env:enter -p cpp-core pc"
cpp-mac = "mise -C ~ run env:enter -p cpp-core mac"
