name: Claude PR review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request targeting the default branch
        required: true
        type: string
      allow_private_diff:
        description: Allow sending patches if this repository is private
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: claude-pr-review-${{ inputs.pr_number }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  review:
    name: Advisory Claude review of one PR's patches
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    permissions:
      contents: read  # check out the trusted default-branch reviewer code
      pull-requests: read  # read PR metadata and file patches via the REST API
    runs-on: ubuntu-24.04
    # Up to four sequential review requests (60 s HTTP timeout each).
    timeout-minutes: 10
    environment: claude-pr-review
    steps:
      - name: Check out only the dispatched default-branch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run offline reviewer unit tests
        run: python3 -B -m unittest discover -s .github/openai-review -p 'test_*.py'
      - name: Review file patches
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
          ALLOW_PRIVATE_DIFF: ${{ inputs.allow_private_diff }}
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_PROVIDER: claude
          REVIEW_API_KEY: ${{ secrets.ANTHROPIC_REVIEW_API_KEY }}
        run: python3 -B .github/openai-review/review.py
