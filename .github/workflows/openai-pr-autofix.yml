name: OpenAI PR autofix

on:
  pull_request:
    types: [labeled]
    branches: [main]

permissions: {}

concurrency:
  group: openai-pr-autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PR_NUMBER: ${{ github.event.pull_request.number }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}

jobs:
  prepare:
    name: Authorize and reserve an autofix round
    if: >-
      ${{ github.event.label.name == 'autofix' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.repository.private }}
    permissions:
      actions: read  # locate the exact successful review artifact
      contents: read  # read the trusted base
      pull-requests: write  # write the durable round reservation
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    outputs:
      authorized: ${{ steps.reserve.outputs.authorized }}
      round: ${{ steps.reserve.outputs.round }}
      review-run: ${{ steps.reserve.outputs.review-run }}
      review-artifact: ${{ steps.reserve.outputs.review-artifact }}
      reason: ${{ steps.reserve.outputs.reason }}
    steps:
      - name: Check out the trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.BASE_SHA }}
          persist-credentials: false
      - name: Authorize labeler, find exact review, and reserve a round
        id: reserve
        env:
          GH_TOKEN: ${{ github.token }}
          LABELER: ${{ github.event.sender.login }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          if [[ ! -f .github/openai-review/autofix.py ]]; then
            exit 0
          fi
          for actor in "${LABELER}" "${TRIGGERING_ACTOR}"; do
            permission="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${actor}/permission" --jq .permission)"
            case "${permission}" in
              admin|maintain|write) ;;
              *) exit 0 ;;
            esac
          done
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          if ! jq -e 'any(.labels[]; .name == "autofix")' <<< "${pr}" >/dev/null; then
            exit 0
          fi
          printf '%s\n' 'authorized=yes' >> "${GITHUB_OUTPUT}"
          if ! jq -e --arg head "${HEAD_SHA}" --arg base "${BASE_SHA}" --arg repo "${GITHUB_REPOSITORY}" \
            '.state == "open" and .head.sha == $head and .base.sha == $base and
            .head.repo.full_name == $repo and .base.repo.private == false' <<< "${pr}" >/dev/null; then
            printf '%s\n' 'reason=PR revision changed.' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          rounds="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | .body | select(startswith("<!-- openai-autofix-round:"))' |
            awk 'END { print NR }')"
          if (( rounds >= 2 )); then
            printf '%s\n' 'reason=Two autofix rounds have already been reserved.' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          review="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/openai-pr-review.yml/runs" --method GET \
            -f head_sha="${HEAD_SHA}" -f branch="${HEAD_BRANCH}" -f event=pull_request -f status=success \
            -f per_page=1 --jq '.workflow_runs[0] // empty')"
          if [[ -n "${review}" ]]; then
            run="$(jq -er '.id' <<< "${review}")"
            attempt="$(jq -er '.run_attempt' <<< "${review}")"
            artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}/artifacts" --method GET \
              -f name="openai-review-${PR_NUMBER}-${BASE_SHA}-${HEAD_SHA}-${attempt}-ready" \
              --jq 'first(.artifacts[] | select(.expired == false) | .id) // empty')"
          fi
          if [[ -z "${artifact:-}" ]]; then
            printf '%s\n' 'reason=No completed review with actionable findings for this PR revision.' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          round="$((rounds + 1))"
          gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body \
            "<!-- openai-autofix-round: ${round} --> OpenAI autofix round ${round} reserved ([run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}))."
          printf 'round=%s\nreview-run=%s\nreview-artifact=%s\n' "${round}" "${run}" "${artifact}" >> "${GITHUB_OUTPUT}"

  generate:
    name: Generate a patch from triaged findings
    needs: prepare
    if: ${{ needs.prepare.outputs.round != '' }}
    permissions:
      actions: read  # download triage from a different run
      contents: read  # fetch the trusted base and the exact head
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: openai-pr-fix
    outputs:
      patch: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out trusted prompt and helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.BASE_SHA }}
          path: trusted
          persist-credentials: false
      - name: Check out the exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          path: candidate
          persist-credentials: false
      - name: Download triaged findings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.review-artifact }}
          run-id: ${{ needs.prepare.outputs.review-run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/triage
      - name: Build the prompt
        env:
          SOURCE: trusted/.github/openai-review
        run: |
          python3 -B "${SOURCE}/autofix.py" prompt "${RUNNER_TEMP}/triage/findings.json" \
            "${SOURCE}/autofix-prompt.md" "${RUNNER_TEMP}/codex-prompt.md" "${PR_NUMBER}" "${BASE_SHA}" "${HEAD_SHA}"
      - name: Generate a candidate patch
        uses: openai/codex-action@306c6a196a99dcc6582530c396a19d2672d5e9ec  # v1.14
        with:
          openai-api-key: ${{ secrets.OPENAI_FIX_API_KEY }}
          working-directory: ${{ github.workspace }}/candidate
          prompt-file: ${{ runner.temp }}/codex-prompt.md
          output-file: ${{ runner.temp }}/codex-result.txt
          model: gpt-6.2-sol
          effort: low
          codex-version: 0.172.0
          codex-args: '["--ephemeral", "-c", "project_doc_max_bytes=0"]'
          permission-profile: :workspace
          safety-strategy: drop-sudo
      - name: Export the worktree changes as data
        id: patch
        run: |
          git -C candidate diff --no-ext-diff --no-textconv --binary "${HEAD_SHA}" -- > "${RUNNER_TEMP}/codex.patch"
          if [[ -s "${RUNNER_TEMP}/codex.patch" ]]; then
            printf '%s\n' 'present=yes' >> "${GITHUB_OUTPUT}"
          fi
      - name: Upload the candidate patch
        id: upload
        if: ${{ steps.patch.outputs.present == 'yes' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: codex-patch-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codex.patch
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Validate and test the candidate patch
    needs: generate
    if: ${{ needs.generate.outputs.patch != '' }}
    permissions:
      contents: read  # fetch the trusted base and the exact head
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MISE_CONFIG_DIR: ${{ github.workspace }}/candidate/unix/home/.config/mise
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}/candidate
    steps:
      - name: Check out trusted patch validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.BASE_SHA }}
          path: trusted
          persist-credentials: false
      - name: Check out the exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          path: candidate
          persist-credentials: false
      - name: Download the candidate patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          artifact-ids: ${{ needs.generate.outputs.patch }}
          path: ${{ runner.temp }}/patch
      - name: Validate and apply the patch
        run: |
          python3 -B trusted/.github/openai-review/autofix.py stage candidate "${RUNNER_TEMP}/patch/codex.patch"
          git -C candidate restore --worktree -- .
      - name: Set up mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78  # v5.3.0
        with:
          version: 2026.11.14
          cache: false
          install: false
      - name: Install locked tools and run tests
        working-directory: candidate
        run: |
          mise trust --all
          MISE_YES=1 MISE_LOCKED=1 mise -C unix/home/.config/mise install --locked
          MISE_YES=1 mise deps uv
          hk check --all --skip-step private-paths
          MISE_YES=1 mise run py:test

  publish:
    name: Publish the verified patch and trigger CI
    needs: [prepare, generate, verify]
    permissions:
      contents: write  # fallback fast-forward push with GITHUB_TOKEN
      pull-requests: read  # verify the live head before pushing
      actions: write  # dispatch CI for a fallback GITHUB_TOKEN push
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: openai-pr-fix
    outputs:
      sha: ${{ steps.push.outputs.sha }}
      mode: ${{ steps.push.outputs.mode }}
    steps:
      - name: Check out trusted patch validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.BASE_SHA }}
          path: trusted
          persist-credentials: false
      - name: Check out the exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          path: candidate
          persist-credentials: false
      - name: Download the verified patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          artifact-ids: ${{ needs.generate.outputs.patch }}
          path: ${{ runner.temp }}/patch
      - name: Validate and stage the verified patch
        run: python3 -B trusted/.github/openai-review/autofix.py stage candidate "${RUNNER_TEMP}/patch/codex.patch"
      - name: Check App configuration
        id: app-config
        env:
          APP_ID: ${{ secrets.AUTOFIX_APP_ID }}
          APP_KEY: ${{ secrets.AUTOFIX_APP_PRIVATE_KEY }}
        run: |
          if [[ -n "${APP_ID}" && -n "${APP_KEY}" ]]; then
            printf '%s\n' 'present=yes' >> "${GITHUB_OUTPUT}"
          elif [[ -n "${APP_ID}" || -n "${APP_KEY}" ]]; then
            printf '%s\n' 'Configure both autofix App credentials.' >&2
            exit 1
          fi
      - name: Mint a repository-scoped push token
        id: app-token
        if: ${{ steps.app-config.outputs.present == 'yes' }}
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc  # v3.4.0
        with:
          client-id: ${{ secrets.AUTOFIX_APP_ID }}
          private-key: ${{ secrets.AUTOFIX_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Commit and push if the PR still matches
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          ROUND: ${{ needs.prepare.outputs.round }}
        run: |
          if [[ -z "${APP_TOKEN}" ]] &&
            [[ "$(git -C candidate rev-parse HEAD:.github/workflows/ci.yml)" != "$(git -C trusted rev-parse HEAD:.github/workflows/ci.yml)" ]]; then
            printf '%s\n' 'Update the PR from the base branch before using fallback CI dispatch.' >&2
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" |
            jq -e --arg repo "${GITHUB_REPOSITORY}" --arg head "${HEAD_SHA}" --arg base "${BASE_SHA}" --arg ref "${HEAD_BRANCH}" \
              '.state == "open" and .head.repo.full_name == $repo and .base.repo.private == false and
              .head.sha == $head and .base.sha == $base and .head.ref == $ref and any(.labels[]; .name == "autofix")' >/dev/null
          git -C candidate -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Apply triaged OpenAI review fixes' -m "OpenAI-Autofix: #${PR_NUMBER} round ${ROUND}"
          url="https://github.com/${GITHUB_REPOSITORY}.git"
          GH_TOKEN="${APP_TOKEN:-${GH_TOKEN}}" git -C candidate -c credential.helper= \
            -c 'credential.helper=!gh auth git-credential' push "${url}" "HEAD:refs/heads/${HEAD_BRANCH}"
          printf 'sha=%s\n' "$(git -C candidate rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          if [[ -n "${APP_TOKEN}" ]]; then
            printf '%s\n' 'mode=GitHub App push' >> "${GITHUB_OUTPUT}"
          else
            printf '%s\n' 'mode=GITHUB_TOKEN push plus CI dispatch' >> "${GITHUB_OUTPUT}"
            gh workflow run ci.yml --repo "${GITHUB_REPOSITORY}" --ref "${HEAD_BRANCH}"
          fi

  finish:
    name: Remove the label and report the result
    needs: [prepare, generate, publish]
    if: ${{ always() && needs.prepare.outputs.authorized == 'yes' }}
    permissions:
      pull-requests: write  # remove the autofix label and post the result
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Remove autofix label and post the outcome
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ needs.prepare.outputs.reason }}
          SHA: ${{ needs.publish.outputs.sha }}
          MODE: ${{ needs.publish.outputs.mode }}
          GENERATED: ${{ needs.generate.result }}
          PATCH_ID: ${{ needs.generate.outputs.patch }}
          PUBLISHED: ${{ needs.publish.result }}
        run: |
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels/autofix" || {
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" |
              jq -e 'all(.[]; .name != "autofix")' >/dev/null
          }
          if [[ "${PUBLISHED}" == success ]]; then
            printf -v message 'OpenAI autofix pushed %s via %s. Await CI and human review.' "${SHA}" "${MODE}"
          elif [[ -n "${SHA}" ]]; then
            printf -v message 'OpenAI autofix pushed %s via %s. CI dispatch failed.' "${SHA}" "${MODE}"
          elif [[ -n "${REASON}" ]]; then
            message="OpenAI autofix skipped. ${REASON}"
          elif [[ "${GENERATED}" == success && -z "${PATCH_ID}" ]]; then
            message='OpenAI autofix produced no patch.'
          else
            message='OpenAI autofix stopped before a verified push. See the run for details.'
          fi
          gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
            --body "${message} (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
