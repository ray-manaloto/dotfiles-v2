[project]
name = "dotfiles-v2"
version = "0.1.0"
description = "Clean-room mise-managed dotfiles, herdr_roll, and schema-first Python automation"
requires-python = ">=3.15"
dependencies = [
  "cyclopts==5.5.2",
  "filelock==4.3.1",
  "openai-agents==0.25.0",
  "orjson==3.13.0",
  "psutil==7.2.2",
  "pydantic==2.14.4",
  "pydantic-settings==2.16.3",
  "structlog==26.1.0",
  "tenacity==9.2.1",
]

[dependency-groups]
dev = [
  { include-group = "lint" },
  { include-group = "test" },
]
lint = [
  "datamodel-code-generator[ruff]==0.101.0",
  "ruff==0.17.6",
  "ty==0.0.112",
]
test = [
  "dirty-equals==0.11.0",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "pytest-xdist==3.8.0",
]

[tool.datamodel-codegen]
preset = "standard-py315-20261123"
input-file-type = "jsonschema"
output-model-type = "pydantic_v2.BaseModel"
target-python-version = "3.15"
extra-fields = "forbid"
enable-faux-immutability = true
use-frozen-field = true
use-annotated = true
use-standard-collections = true
use-union-operator = true
use-type-alias = true
use-subclass-enum = true
use-specialized-enum = true
enum-field-as-literal = "none"
open-enums = "none"
strict-types = ["str", "bytes", "int", "float", "bool"]
strict-nullable = true
field-constraints = true
use-schema-description = true
use-field-description = true
use-field-description-example = true
reuse-model = true
reuse-scope = "tree"
collapse-root-models = true
use-double-quotes = true
snake-case-field = true
allow-population-by-field-name = true
capitalise-enum-members = true
disable-timestamp = true
formatters = ["ruff-check", "ruff-format"]
input = "schemas"
output = "unix/home/.config/mise/lib/dotfiles_py/generated"
shared-module-name = "common"
all-exports-scope = "recursive"
all-exports-collision-strategy = "error"
custom-file-header = "# GENERATED by datamodel-codegen — edit schemas/**/*.schema.json and run `mise run py:codegen`."

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["unix/home/.config/mise/lib"]
testpaths = ["tests", "unix/home/.config/mise/lib/herdr_roll/tests"]

[tool.ruff]
line-length = 88
target-version = "py315"
src = ["unix/home/.config/mise/lib"]
# Run by /usr/bin/python3 (3.9 on macOS) or as stdlib lint steps: keep ruff from emitting newer syntax
# (#112; the hooks dir also has its own ruff.toml). hk step py39-compat compiles them under 3.9.
per-file-target-version = { "unix/home/.gemini/config/hooks/*.py" = "py39", "tasks/py/metadata_gate_lint.py" = "py39", "tasks/py/remote_ssh_lint.py" = "py39", "tasks/py/doppler_token_lint.py" = "py39", "tasks/py/py39_compat.py" = "py39" }

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "T201", "TID251", "RUF"]
ignore = ["E501", "RUF001"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"logging.getLogger".msg = "Use dotfiles_py.logging.get_logger() instead of logging.getLogger."
"logging.basicConfig".msg = "Use dotfiles_py.logging.configure_logging() instead of logging.basicConfig."

[tool.ruff.lint.per-file-ignores]
"unix/home/.config/mise/lib/dotfiles_py/logging.py" = ["TID251"]
"unix/home/.gemini/config/hooks/*.py" = ["SIM105", "UP017"]

[tool.ty.environment]
python-version = "3.15"
root = ["unix/home/.config/mise/lib", ".github/openai-review", "."]

[tool.uv]
package = false
exclude-newer = "7 days"
exclude-newer-package = { filelock = false, pydantic = false, pydantic-core = false, datamodel-code-generator = false, cyclopts = false, ruff = false, ty = false }
